<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - BCA Nepal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
      color: #0f172a;
      background: #f8fafc;
    }
    .icon-wrap {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #e0f2fe;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
    }
    .icon-wrap svg { width: 40px; height: 40px; color: #2563eb; }
    h1 { font-size: 1.35rem; font-weight: 800; margin-bottom: 0.35rem; }
    .subtitle { font-size: 0.82rem; font-weight: 700; color: #2563eb; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.6rem; }
    .failed-url {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.78rem;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 0.5rem 0.8rem;
      color: #334155;
      max-width: 100%;
      width: fit-content;
      margin: 0.5rem auto 1rem;
      overflow-wrap: anywhere;
      word-break: break-all;
    }
    p { color: #64748b; font-size: 0.92rem; line-height: 1.6; max-width: 340px; margin-bottom: 0.25rem; }
    .hint { font-size: 0.82rem; color: #94a3b8; margin-top: 0.25rem; max-width: 320px; line-height: 1.5; }
    .pages {
      display: flex; flex-wrap: wrap; gap: 0.5rem;
      justify-content: center; margin: 1.25rem 0 0.25rem; max-width: 340px;
    }
    .page-chip {
      background: #f1f5f9; padding: 0.4rem 0.75rem; border-radius: 999px;
      font-size: 0.78rem; font-weight: 600; color: #334155;
      display: inline-flex; align-items: center; gap: 0.3rem;
    }
    .page-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; display: inline-block; }
    .btn-row {
      display: flex; gap: 0.6rem; margin-top: 1.5rem; width: 100%;
      max-width: 340px; justify-content: center;
    }
    .home-btn, .retry-btn {
      flex: 1;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: opacity 0.2s;
    }
    .home-btn {
      background: #2563eb;
      color: #fff;
      box-shadow: 0 8px 24px rgba(37,99,235,0.2);
    }
    .home-btn:hover { opacity: 0.9; }
    .home-btn:active, .retry-btn:active { transform: scale(0.97); }
    .retry-btn {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #e2e8f0;
      box-shadow: none;
    }
    .retry-btn:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="icon-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 0 1 0 12.728m-2.829-2.829a5 5 0 0 0 0-7.07m-4.243 4.243a1 1 0 0 1 0-1.414" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18" />
    </svg>
  </div>
  <div class="subtitle">You&rsquo;re Offline</div>
  <h1>Page Not Found</h1>
  <code class="failed-url" id="failed-url">/</code>
  <p>This page isn&rsquo;t in your offline cache. Open it once while you&rsquo;re connected to the internet and it will be saved for offline use.</p>
  <p class="hint">Already visited pages are still available below.</p>
  <div class="pages">
    <a class="page-chip" href="/"><span class="dot"></span> Home</a>
    <a class="page-chip" href="/subjects"><span class="dot"></span> Subjects</a>
    <a class="page-chip" href="/subjects/entrance"><span class="dot"></span> Entrance</a>
    <a class="page-chip" href="/mock-test"><span class="dot"></span> Mock Test</a>
    <a class="page-chip" href="/lectures"><span class="dot"></span> Lectures</a>
    <a class="page-chip" href="/bookmark"><span class="dot"></span> Bookmarks</a>
    <a class="page-chip" href="/profile"><span class="dot"></span> Profile</a>
  </div>
  <div class="btn-row">
    <a class="home-btn" href="/">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Back to Home
    </a>
    <button class="retry-btn" onclick="window.location.reload()">Try Again</button>
  </div>
  <script>
    (function () {
      var el = document.getElementById("failed-url");
      if (el) {
        var path = window.location.pathname || "/";
        var search = window.location.search || "";
        el.textContent = path + search;
        var title = document.title;
        if (path !== "/") document.title = path + " - " + title;
      }
    })();
  </script>
</body>
</html>
