<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; fill: #f8fafc; font-size: 24px; }
    .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; font-size: 14px; }
    .label { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 13px; }
    .desc { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; fill: #94a3b8; }
  </style>

  <rect width="100%" height="100%" rx="16" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <text x="40" y="50" class="title">Design Systems</text>
  <text x="40" y="75" class="subtitle">Reusable components + tokens + documentation = consistency at scale</text>

  <!-- Left: token layer -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="220" height="200" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <text x="18" y="30" class="label" fill="#60a5fa">Design Tokens</text>
    <rect x="20" y="44" width="180" height="26" rx="6" fill="#0f172a" stroke="#334155" />
    <circle cx="38" cy="57" r="7" fill="#3b82f6" />
    <text x="54" y="61" font-family="'Courier New', monospace" font-size="11" fill="#94a3b8">--color-primary</text>
    <rect x="20" y="78" width="180" height="26" rx="6" fill="#0f172a" stroke="#334155" />
    <rect x="31" y="85" width="14" height="12" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.5" />
    <text x="54" y="95" font-family="'Courier New', monospace" font-size="11" fill="#94a3b8">--space-4 = 8px</text>
    <rect x="20" y="112" width="180" height="26" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="34" y="129" font-family="'Segoe UI', sans-serif" font-size="13" fill="#94a3b8">Aa</text>
    <text x="54" y="129" font-family="'Courier New', monospace" font-size="11" fill="#94a3b8">--font-body</text>
    <rect x="20" y="146" width="180" height="26" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="34" y="163" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">&#9670;</text>
    <text x="54" y="163" font-family="'Courier New', monospace" font-size="11" fill="#94a3b8">--radius-md</text>
    <text x="18" y="188" class="desc" fill="#64748b">Named values power themes &amp; platforms</text>
  </g>

  <!-- Middle: components -->
  <g transform="translate(290, 100)">
    <rect x="0" y="0" width="220" height="200" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="18" y="30" class="label" fill="#34d399">Component Library</text>
    <rect x="20" y="44" width="80" height="26" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="60" y="61" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Button</text>
    <rect x="108" y="44" width="80" height="26" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="148" y="61" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Input</text>
    <rect x="20" y="78" width="80" height="26" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="60" y="95" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Card</text>
    <rect x="108" y="78" width="80" height="26" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="148" y="95" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Modal</text>
    <rect x="20" y="112" width="80" height="26" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="60" y="129" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Navbar</text>
    <rect x="108" y="112" width="80" height="26" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="148" y="129" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Toast</text>
    <rect x="20" y="146" width="180" height="26" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="110" y="163" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#34d399">+ 40 more</text>
    <text x="18" y="188" class="desc" fill="#64748b">Reusable, tested, consistent everywhere</text>
  </g>

  <!-- Right: docs -->
  <g transform="translate(540, 100)">
    <rect x="0" y="0" width="220" height="200" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <text x="18" y="30" class="label" fill="#fbbf24">Living Documentation</text>
    <rect x="20" y="44" width="180" height="22" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="32" y="59" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Usage guidelines</text>
    <rect x="20" y="72" width="180" height="22" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="32" y="87" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Do's &amp; don'ts</text>
    <rect x="20" y="100" width="180" height="22" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="32" y="115" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Code examples</text>
    <rect x="20" y="128" width="180" height="22" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="32" y="143" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Accessibility notes</text>
    <text x="18" y="168" class="desc" fill="#64748b">Must be maintained with the system</text>
  </g>

  <text x="400" y="330" text-anchor="middle" class="label" fill="#f8fafc" font-size="15">Tokens &#8594; Components &#8594; Docs &#8594; Products</text>
  <text x="400" y="360" text-anchor="middle" class="desc" fill="#94a3b8">Material Design &#183; HIG &#183; Carbon &#183; Lightning &#8212; consistency, speed, shared language</text>

  <rect x="150" y="380" width="500" height="2" fill="#334155" />
  <text x="400" y="410" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="600" fill="#64748b" font-size="12">One source of truth across teams, platforms and products</text>
</svg>
