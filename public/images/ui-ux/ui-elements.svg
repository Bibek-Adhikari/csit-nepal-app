<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgGrad)" />
  <rect width="800" height="450" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <text x="40" y="45" font-family="system-ui, sans-serif" font-weight="700" fill="#f8fafc" font-size="22">What is User Interface (UI)?</text>
  <text x="40" y="68" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="13">The visual layer users interact with</text>

  <!-- Phone mockup -->
  <rect x="300" y="100" width="200" height="320" rx="24" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <rect x="310" y="120" width="180" height="280" rx="12" fill="#0f172a" />

  <!-- Status bar -->
  <rect x="325" y="130" width="40" height="6" rx="3" fill="#334155" />
  <circle cx="465" cy="133" r="4" fill="#334155" />

  <!-- App header -->
  <rect x="325" y="150" width="150" height="24" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
  <text x="400" y="166" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#60a5fa" font-size="11">Brand Header</text>

  <!-- Image placeholder -->
  <rect x="325" y="185" width="150" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <rect x="355" y="205" width="20" height="20" rx="4" fill="#3b82f6" opacity="0.4" />
  <rect x="380" y="205" width="60" height="8" rx="3" fill="#334155" />
  <rect x="380" y="218" width="40" height="6" rx="2" fill="#334155" />

  <!-- Text lines -->
  <rect x="325" y="275" width="150" height="8" rx="3" fill="#334155" />
  <rect x="325" y="290" width="120" height="8" rx="3" fill="#334155" />
  <rect x="325" y="305" width="140" height="8" rx="3" fill="#334155" />

  <!-- CTA Button -->
  <rect x="340" y="330" width="120" height="32" rx="16" fill="#3b82f6" />
  <text x="400" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#ffffff" font-size="12">Action Button</text>

  <!-- Bottom nav -->
  <rect x="325" y="375" width="150" height="25" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <circle cx="355" cy="387" r="5" fill="#3b82f6" />
  <circle cx="400" cy="387" r="5" fill="#334155" />
  <circle cx="445" cy="387" r="5" fill="#334155" />

  <!-- Left side: UI Elements list -->
  <text x="50" y="140" font-family="system-ui, sans-serif" font-weight="700" fill="#f1f5f9" font-size="15">UI Elements:</text>
  <text x="50" y="168" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="12">&#8226; Layout &amp; Composition</text>
  <text x="50" y="190" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="12">&#8226; Color Schemes</text>
  <text x="50" y="212" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="12">&#8226; Typography</text>
  <text x="50" y="234" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="12">&#8226; Icons &amp; Imagery</text>
  <text x="50" y="256" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="12">&#8226; Spacing &amp; Grid</text>
  <text x="50" y="278" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="12">&#8226; Buttons &amp; Forms</text>
  <text x="50" y="300" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="12">&#8226; Animations</text>

  <!-- Right side: goal -->
  <text x="560" y="140" font-family="system-ui, sans-serif" font-weight="700" fill="#f1f5f9" font-size="15">Goal of UI:</text>
  <text x="560" y="168" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="12">Create interfaces that are</text>
  <text x="560" y="190" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="12">both visually appealing</text>
  <text x="560" y="212" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="12">and functionally intuitive.</text>
</svg>