<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="warningGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="dangerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; fill: #f8fafc; font-size: 24px; }
    .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; font-size: 14px; }
    .label { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 14px; text-anchor: middle; }
    .desc { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #cbd5e1; text-anchor: middle; }
  </style>

  <rect width="100%" height="100%" rx="16" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <text x="40" y="50" class="title">Button States</text>
  <text x="40" y="75" class="subtitle">Different interactive states communicate availability and feedback</text>

  <!-- Default -->
  <g transform="translate(80, 120)">
    <rect x="0" y="0" width="140" height="48" rx="10" fill="url(#primaryGrad)" />
    <text x="70" y="29" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" fill="#ffffff" font-size="14">Default</text>
    <text x="70" y="80" class="desc" style="fill: #94a3b8;">Ready to click</text>
  </g>

  <!-- Hover -->
  <g transform="translate(250, 120)">
    <rect x="0" y="0" width="140" height="48" rx="10" fill="url(#primaryGrad)" opacity="0.85" />
    <rect x="0" y="0" width="140" height="48" rx="10" fill="none" stroke="#60a5fa" stroke-width="2" />
    <text x="70" y="29" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" fill="#ffffff" font-size="14">Hover</text>
    <text x="70" y="80" class="desc" style="fill: #94a3b8;">Mouse over</text>
  </g>

  <!-- Active/Pressed -->
  <g transform="translate(420, 120)">
    <rect x="0" y="0" width="140" height="48" rx="10" fill="#1d4ed8" />
    <rect x="0" y="0" width="140" height="48" rx="10" fill="none" stroke="#3b82f6" stroke-width="2" />
    <text x="70" y="29" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" fill="#dbeafe" font-size="14">Active</text>
    <text x="70" y="80" class="desc" style="fill: #94a3b8;">Being pressed</text>
  </g>

  <!-- Focus -->
  <g transform="translate(590, 120)">
    <rect x="0" y="0" width="140" height="48" rx="10" fill="url(#primaryGrad)" />
    <rect x="-3" y="-3" width="146" height="54" rx="12" fill="none" stroke="#fbbf24" stroke-width="3" />
    <text x="70" y="29" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" fill="#ffffff" font-size="14">Focus</text>
    <text x="70" y="80" class="desc" style="fill: #94a3b8;">Keyboard nav</text>
  </g>

  <!-- Disabled -->
  <g transform="translate(80, 260)">
    <rect x="0" y="0" width="140" height="48" rx="10" fill="#334155" />
    <text x="70" y="29" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" fill="#64748b" font-size="14">Disabled</text>
    <text x="70" y="80" class="desc" style="fill: #64748b;">Not available</text>
  </g>

  <!-- Loading -->
  <g transform="translate(250, 260)">
    <rect x="0" y="0" width="140" height="48" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="55" cy="24" r="8" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="20" stroke-linecap="round" />
    <text x="80" y="29" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" fill="#94a3b8" font-size="14">Loading</text>
    <text x="70" y="80" class="desc" style="fill: #64748b;">Processing</text>
  </g>

  <!-- Success -->
  <g transform="translate(420, 260)">
    <rect x="0" y="0" width="140" height="48" rx="10" fill="url(#successGrad)" />
    <text x="70" y="29" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" fill="#ffffff" font-size="14">Success</text>
    <text x="70" y="80" class="desc" style="fill: #94a3b8;">Action done</text>
  </g>

  <!-- Danger -->
  <g transform="translate(590, 260)">
    <rect x="0" y="0" width="140" height="48" rx="10" fill="url(#dangerGrad)" />
    <text x="70" y="29" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" fill="#ffffff" font-size="14">Danger</text>
    <text x="70" y="80" class="desc" style="fill: #94a3b8;">Destructive</text>
  </g>
</svg>