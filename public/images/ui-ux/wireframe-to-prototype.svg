<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; fill: #f8fafc; font-size: 24px; }
    .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; font-size: 14px; }
    .label { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 13px; }
    .desc { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; fill: #94a3b8; }
  </style>

  <rect width="100%" height="100%" rx="16" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <text x="40" y="50" class="title">From Wireframe to Prototype</text>
  <text x="40" y="75" class="subtitle">Refine, test, iterate &#8212; then hand off a clear spec to development</text>

  <!-- Pipeline -->
  <g transform="translate(40, 100)">
    <!-- sketch -->
    <rect x="0" y="40" width="130" height="100" rx="10" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <path d="M20 62 Q 30 58 40 63 T 60 60" fill="none" stroke="#64748b" stroke-width="2" />
    <path d="M20 76 Q 34 72 48 77 T 66 74" fill="none" stroke="#64748b" stroke-width="2" />
    <text x="65" y="160" text-anchor="middle" class="label" fill="#94a3b8">Sketch</text>
    <text x="65" y="176" text-anchor="middle" class="desc" fill="#64748b">minutes to change</text>
    <!-- arrow -->
    <line x1="130" y1="90" x2="170" y2="90" stroke="#475569" stroke-width="2" />
    <polygon points="172,90 167,86 167,94" fill="#475569" />
    <!-- wireframe -->
    <rect x="174" y="40" width="130" height="100" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <rect x="188" y="52" width="102" height="14" rx="3" fill="#1e293b" stroke="#334155" />
    <rect x="188" y="74" width="102" height="40" rx="4" fill="#1e293b" stroke="#334155" />
    <rect x="188" y="122" width="102" height="8" rx="3" fill="#334155" />
    <text x="239" y="160" text-anchor="middle" class="label" fill="#34d399">Wireframe</text>
    <text x="239" y="176" text-anchor="middle" class="desc" fill="#64748b">hours to change</text>
    <!-- arrow -->
    <line x1="304" y1="90" x2="344" y2="90" stroke="#475569" stroke-width="2" />
    <polygon points="346,90 341,86 341,94" fill="#475569" />
    <!-- prototype -->
    <rect x="348" y="40" width="130" height="100" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
    <rect x="362" y="52" width="102" height="14" rx="3" fill="#1e293b" stroke="#f59e0b" />
    <rect x="362" y="74" width="46" height="40" rx="4" fill="#1e293b" stroke="#334155" />
    <rect x="416" y="74" width="48" height="40" rx="4" fill="#1e293b" stroke="#334155" />
    <rect x="362" y="122" width="102" height="8" rx="3" fill="#334155" />
    <text x="413" y="160" text-anchor="middle" class="label" fill="#fbbf24">Prototype</text>
    <text x="413" y="176" text-anchor="middle" class="desc" fill="#64748b">days to change</text>
    <!-- arrow -->
    <line x1="478" y1="90" x2="518" y2="90" stroke="#475569" stroke-width="2" />
    <polygon points="520,90 515,86 515,94" fill="#475569" />
    <!-- code -->
    <rect x="522" y="40" width="130" height="100" rx="10" fill="#0f172a" stroke="#ec4899" stroke-width="2" />
    <text x="587" y="84" text-anchor="middle" font-family="'Courier New', monospace" font-size="20" fill="#f472b6">&lt;/&gt;</text>
    <text x="587" y="110" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#64748b">npm run dev</text>
    <text x="587" y="160" text-anchor="middle" class="label" fill="#f472b6">Production</text>
    <text x="587" y="176" text-anchor="middle" class="desc" fill="#64748b">weeks to change</text>
    <!-- cost band -->
    <rect x="0" y="196" width="652" height="18" rx="9" fill="#1e293b" stroke="#334155" />
    <rect x="0" y="196" width="130" height="18" rx="9" fill="#10b981" opacity="0.7" />
    <rect x="174" y="196" width="130" height="18" rx="9" fill="#84cc16" opacity="0.7" />
    <rect x="348" y="196" width="130" height="18" rx="9" fill="#f59e0b" opacity="0.7" />
    <rect x="522" y="196" width="130" height="18" rx="9" fill="#dc2626" opacity="0.7" />
    <text x="326" y="234" text-anchor="middle" class="desc" fill="#94a3b8">Cost of change grows as you move right &#8212; front-load design investment</text>
  </g>

  <!-- Testing + handoff -->
  <g transform="translate(40, 265)">
    <rect x="0" y="0" width="350" height="120" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" />
    <text x="18" y="30" class="label" fill="#a78bfa">Testing with Prototypes</text>
    <text x="20" y="56" class="desc" fill="#94a3b8">&#8226; Observe real users attempting tasks</text>
    <text x="20" y="76" class="desc" fill="#94a3b8">&#8226; Identify confusion &amp; navigation issues</text>
    <text x="20" y="96" class="desc" fill="#94a3b8">&#8226; Multiple test-and-refine loops</text>
  </g>

  <g transform="translate(410, 265)">
    <rect x="0" y="0" width="350" height="120" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="2" />
    <text x="18" y="30" class="label" fill="#22d3ee">Handoff to Development</text>
    <text x="20" y="56" class="desc" fill="#94a3b8">&#8226; Annotated states &amp; interactions</text>
    <text x="20" y="76" class="desc" fill="#94a3b8">&#8226; Edge cases and empty states</text>
    <text x="20" y="96" class="desc" fill="#94a3b8">&#8226; Prototype = living specification</text>
  </g>
</svg>
