<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgGrad)" />
  <rect width="800" height="450" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <text x="40" y="45" font-family="system-ui, sans-serif" font-weight="700" fill="#f8fafc" font-size="22">UX Design Process</text>
  <text x="40" y="68" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="13">Five phases from research to testing</text>

  <!-- Phase boxes -->
  <!-- Research -->
  <rect x="40" y="100" width="130" height="120" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
  <text x="105" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#60a5fa" font-size="14">Research</text>
  <text x="105" y="160" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Interviews</text>
  <text x="105" y="180" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Surveys</text>
  <text x="105" y="200" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Analytics</text>

  <!-- Arrow 1 -->
  <line x1="175" y1="160" x2="205" y2="160" stroke="#475569" stroke-width="2" />
  <polygon points="207,160 202,156 202,164" fill="#475569" />

  <!-- Define -->
  <rect x="210" y="100" width="130" height="120" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2" />
  <text x="275" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#34d399" font-size="14">Define</text>
  <text x="275" y="160" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Personas</text>
  <text x="275" y="180" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">User Stories</text>
  <text x="275" y="200" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Requirements</text>

  <!-- Arrow 2 -->
  <line x1="345" y1="160" x2="375" y2="160" stroke="#475569" stroke-width="2" />
  <polygon points="377,160 372,156 372,164" fill="#475569" />

  <!-- Ideate -->
  <rect x="380" y="100" width="130" height="120" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
  <text x="445" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#fbbf24" font-size="14">Ideate</text>
  <text x="445" y="160" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Sketching</text>
  <text x="445" y="180" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Brainstorm</text>
  <text x="445" y="200" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Wireframes</text>

  <!-- Arrow 3 -->
  <line x1="515" y1="160" x2="545" y2="160" stroke="#475569" stroke-width="2" />
  <polygon points="547,160 542,156 542,164" fill="#475569" />

  <!-- Prototype -->
  <rect x="550" y="100" width="130" height="120" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="2" />
  <text x="615" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#f472b6" font-size="14">Prototype</text>
  <text x="615" y="160" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Mockups</text>
  <text x="615" y="180" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Interactions</text>
  <text x="615" y="200" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Figma</text>

  <!-- Arrow 4 (down and back for Test) -->
  <line x1="680" y1="160" x2="720" y2="160" stroke="#475569" stroke-width="2" />
  <polygon points="722,160 717,156 717,164" fill="#475569" />
  <text x="700" y="150" text-anchor="middle" font-family="system-ui, sans-serif" fill="#64748b" font-size="9">then</text>

  <!-- Test -->
  <rect x="340" y="270" width="130" height="120" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" />
  <text x="405" y="305" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#a78bfa" font-size="14">Test</text>
  <text x="405" y="330" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Usability</text>
  <text x="405" y="350" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">A/B Testing</text>
  <text x="405" y="370" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Iterate</text>

  <!-- Iteration arrow from Test back to Research -->
  <line x1="340" y1="330" x2="170" y2="330" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,3" />
  <line x1="170" y1="330" x2="170" y2="225" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,3" />
  <polygon points="105,225 170,225 170,220 165,225 170,230 170,225" fill="none" />
  <polygon points="103,225 110,221 110,229" fill="#475569" />
  <text x="240" y="348" text-anchor="middle" font-family="system-ui, sans-serif" fill="#64748b" font-size="10">Iterate &amp; Improve</text>
</svg>