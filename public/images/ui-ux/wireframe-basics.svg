<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; fill: #f8fafc; font-size: 24px; }
    .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; font-size: 14px; }
    .label { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 13px; }
    .desc { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; fill: #94a3b8; }
  </style>

  <rect width="100%" height="100%" rx="16" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <text x="40" y="50" class="title">Wireframing Basics</text>
  <text x="40" y="75" class="subtitle">Low-fidelity blueprints for structure, hierarchy and flow</text>

  <!-- Example wireframe -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="340" height="290" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <text x="18" y="30" class="label" fill="#60a5fa">A simple wireframe</text>
    <!-- nav -->
    <rect x="20" y="44" width="300" height="26" rx="4" fill="#0f172a" stroke="#334155" />
    <rect x="28" y="52" width="40" height="10" rx="3" fill="#3b82f6" />
    <rect x="140" y="52" width="26" height="10" rx="3" fill="#475569" />
    <rect x="172" y="52" width="26" height="10" rx="3" fill="#475569" />
    <rect x="204" y="52" width="26" height="10" rx="3" fill="#475569" />
    <rect x="240" y="52" width="60" height="10" rx="3" fill="#475569" />
    <!-- hero -->
    <rect x="20" y="80" width="300" height="46" rx="4" fill="#0f172a" stroke="#334155" />
    <rect x="28" y="92" width="180" height="10" rx="3" fill="#475569" />
    <rect x="28" y="108" width="140" height="8" rx="3" fill="#334155" />
    <!-- image + text -->
    <rect x="20" y="136" width="110" height="90" rx="4" fill="#0f172a" stroke="#334155" />
    <rect x="150" y="142" width="160" height="8" rx="3" fill="#475569" />
    <rect x="150" y="158" width="150" height="8" rx="3" fill="#334155" />
    <rect x="150" y="174" width="140" height="8" rx="3" fill="#334155" />
    <rect x="150" y="190" width="120" height="8" rx="3" fill="#334155" />
    <rect x="150" y="206" width="80" height="16" rx="4" fill="#3b82f6" />
    <!-- footer -->
    <rect x="20" y="236" width="300" height="22" rx="4" fill="#0f172a" stroke="#334155" />
    <rect x="28" y="245" width="80" height="5" rx="2" fill="#475569" />
    <rect x="150" y="245" width="60" height="5" rx="2" fill="#475569" />
    <text x="170" y="270" text-anchor="middle" class="desc" fill="#64748b">Boxes + labels = fast layout exploration</text>
  </g>

  <!-- What it includes / excludes -->
  <g transform="translate(400, 100)">
    <rect x="0" y="0" width="360" height="130" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="18" y="30" class="label" fill="#34d399">Includes</text>
    <text x="20" y="56" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">&#8226; Content blocks &amp; layout</text>
    <text x="20" y="78" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">&#8226; Navigation &amp; hierarchy</text>
    <text x="20" y="100" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">&#8226; Functional elements (buttons, forms)</text>
    <text x="20" y="122" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">&#8226; Placeholder text &amp; images</text>
  </g>

  <g transform="translate(400, 250)">
    <rect x="0" y="0" width="360" height="140" rx="12" fill="#1e293b" stroke="#dc2626" stroke-width="2" />
    <text x="18" y="30" class="label" fill="#f87171">Excludes</text>
    <text x="20" y="58" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">&#8226; Final colors &amp; typography</text>
    <text x="20" y="80" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">&#8226; Real images &amp; exact copy</text>
    <text x="20" y="102" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">&#8226; Animations &amp; motion</text>
    <text x="20" y="124" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">&#8226; Visual polish &#8212; stay abstract</text>
  </g>
</svg>
