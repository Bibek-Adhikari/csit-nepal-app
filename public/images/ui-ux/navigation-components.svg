<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; fill: #f8fafc; font-size: 24px; }
    .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; font-size: 14px; }
    .label { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 13px; }
    .desc { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; fill: #94a3b8; }
  </style>

  <rect width="100%" height="100%" rx="16" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <text x="40" y="50" class="title">Navigation Components</text>
  <text x="40" y="75" class="subtitle">Structured building blocks that help users find their way</text>

  <!-- Navbar -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="350" height="150" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <text x="18" y="28" class="label" fill="#60a5fa">Navbar</text>
    <rect x="16" y="42" width="318" height="40" rx="6" fill="#0f172a" stroke="#334155" />
    <rect x="28" y="54" width="70" height="16" rx="4" fill="#3b82f6" />
    <rect x="180" y="58" width="30" height="8" rx="3" fill="#475569" />
    <rect x="220" y="58" width="30" height="8" rx="3" fill="#475569" />
    <rect x="260" y="58" width="30" height="8" rx="3" fill="#475569" />
    <rect x="300" y="54" width="20" height="16" rx="4" fill="#0f172a" stroke="#475569" />
    <rect x="16" y="96" width="318" height="30" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="18" y="138" class="desc">Logo + main links + utility items, consistent site-wide.</text>
  </g>

  <!-- Tabs -->
  <g transform="translate(410, 100)">
    <rect x="0" y="0" width="350" height="150" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="18" y="28" class="label" fill="#34d399">Tabs</text>
    <rect x="16" y="46" width="96" height="30" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="64" y="65" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#34d399">Overview</text>
    <rect x="118" y="46" width="96" height="30" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="166" y="65" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">Details</text>
    <rect x="220" y="46" width="96" height="30" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="268" y="65" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">Reviews</text>
    <rect x="16" y="90" width="318" height="36" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="18" y="138" class="desc">Related views within a single page or section.</text>
  </g>

  <!-- Pagination -->
  <g transform="translate(40, 275)">
    <rect x="0" y="0" width="350" height="110" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <text x="18" y="28" class="label" fill="#fbbf24">Pagination</text>
    <circle cx="62" cy="66" r="16" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
    <text x="62" y="71" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#fbbf24">&#8249;</text>
    <circle cx="110" cy="66" r="16" fill="#1e3a2f" stroke="#10b981" stroke-width="1.5" />
    <text x="110" y="71" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#34d399">1</text>
    <circle cx="150" cy="66" r="16" fill="#0f172a" stroke="#334155" />
    <text x="150" y="71" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#94a3b8">2</text>
    <circle cx="190" cy="66" r="16" fill="#0f172a" stroke="#334155" />
    <text x="190" y="71" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#94a3b8">3</text>
    <circle cx="258" cy="66" r="16" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
    <text x="258" y="71" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#fbbf24">&#8250;</text>
    <text x="18" y="100" class="desc">Numbered pages with prev/next and &#8220;showing X of Y&#8221;.</text>
  </g>

  <!-- Breadcrumbs -->
  <g transform="translate(410, 275)">
    <rect x="0" y="0" width="350" height="110" rx="12" fill="#1e293b" stroke="#ec4899" stroke-width="2" />
    <text x="18" y="28" class="label" fill="#f472b6">Breadcrumbs</text>
    <rect x="16" y="42" width="318" height="26" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="30" y="60" font-family="'Segoe UI', sans-serif" font-size="12" fill="#f472b6">Home</text>
    <text x="78" y="60" font-family="'Segoe UI', sans-serif" font-size="12" fill="#64748b">&gt;</text>
    <text x="94" y="60" font-family="'Segoe UI', sans-serif" font-size="12" fill="#f472b6">Subjects</text>
    <text x="158" y="60" font-family="'Segoe UI', sans-serif" font-size="12" fill="#64748b">&gt;</text>
    <text x="174" y="60" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">Semester 2</text>
    <text x="18" y="96" class="desc">Clickable location trail essential for deep structures.</text>
  </g>
</svg>
