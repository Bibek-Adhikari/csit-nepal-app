<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgGrad)" />
  <rect width="800" height="450" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <text x="40" y="45" font-family="system-ui, sans-serif" font-weight="700" fill="#f8fafc" font-size="22">Tools of the Trade</text>
  <text x="40" y="68" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="13">Popular tools used by UX/UI designers</text>

  <!-- Figma -->
  <rect x="40" y="95" width="160" height="130" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
  <circle cx="120" cy="130" r="18" fill="#3b82f6" />
  <text x="120" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#fff" font-size="14">F</text>
  <text x="120" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#60a5fa" font-size="14">Figma</text>
  <text x="120" y="195" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Design &amp; Prototype</text>
  <text x="120" y="212" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Collaboration</text>

  <!-- Sketch -->
  <rect x="240" y="95" width="160" height="130" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
