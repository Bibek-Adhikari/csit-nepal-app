  <text x="320" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#fff" font-size="14">S</text>
  <text x="320" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#34d399" font-size="14">Sketch</text>
  <text x="320" y="195" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">UI Design</text>
  <text x="320" y="212" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Mac Only</text>

  <!-- Adobe XD -->
  <rect x="440" y="95" width="160" height="130" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
  <circle cx="520" cy="130" r="18" fill="#f59e0b" />
  <text x="520" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#fff" font-size="14">X</text>
  <text x="520" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#fbbf24" font-size="14">Adobe XD</text>
  <text x="520" y="195" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Prototyping</text>
  <text x="520" y="212" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Voice UI</text>

  <!-- InVision -->
  <rect x="40" y="255" width="160" height="130" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
  <circle cx="120" cy="290" r="18" fill="#ec4899" />
  <text x="120" y="295" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#fff" font-size="14">I</text>
  <text x="120" y="325" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#f472b6" font-size="14">InVision</text>
  <text x="120" y="350" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Prototyping</text>
  <text x="120" y="367" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Handoff</text>

  <!-- Miro -->
  <rect x="240" y="255" width="160" height="130" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" />
  <circle cx="320" cy="290" r="18" fill="#8b5cf6" />
  <text x="320" y="295" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#fff" font-size="14">M</text>
  <text x="320" y="325" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#a78bfa" font-size="14">Miro</text>
  <text x="320" y="350" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Whiteboarding</text>
  <text x="320" y="367" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Workshops</text>

  <!-- Principle -->
  <rect x="440" y="255" width="160" height="130" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
  <circle cx="520" cy="290" r="18" fill="#06b6d4" />
  <text x="520" y="295" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#fff" font-size="14">P</text>
  <text x="520" y="325" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#22d3ee" font-size="14">Principle</text>
  <text x="520" y="350" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Interaction</text>
  <text x="520" y="367" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Animation</text>
</svg>