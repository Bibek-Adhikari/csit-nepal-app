<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; fill: #f8fafc; font-size: 24px; }
    .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; font-size: 14px; }
    .label { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 13px; }
    .desc { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; fill: #94a3b8; }
  </style>

  <rect width="100%" height="100%" rx="16" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <text x="40" y="50" class="title">Heuristic Evaluation</text>
  <text x="40" y="75" class="subtitle">Fast expert review against proven usability principles</text>

  <!-- Process -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="350" height="170" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <text x="18" y="30" class="label" fill="#60a5fa">The Process</text>
    <rect x="20" y="44" width="145" height="40" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="92" y="60" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">1. Individual review</text>
    <text x="92" y="76" text-anchor="middle" class="desc" fill="#64748b">each evaluator alone</text>
    <rect x="185" y="44" width="145" height="40" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="257" y="60" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">2. Combine findings</text>
    <text x="257" y="76" text-anchor="middle" class="desc" fill="#64748b">3-5 evaluators</text>
    <rect x="20" y="96" width="145" height="40" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="92" y="112" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">3. Rate severity</text>
    <text x="92" y="128" text-anchor="middle" class="desc" fill="#64748b">0 - 4 scale</text>
    <rect x="185" y="96" width="145" height="40" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="257" y="112" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">4. Prioritize fixes</text>
    <text x="257" y="128" text-anchor="middle" class="desc" fill="#64748b">actionable plan</text>
  </g>

  <!-- Severity scale -->
  <g transform="translate(410, 100)">
    <rect x="0" y="0" width="350" height="170" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="18" y="30" class="label" fill="#34d399">Severity Ratings</text>
    <text x="24" y="54" font-family="'Segoe UI', sans-serif" font-size="11" fill="#10b981">0</text>
    <text x="40" y="54" class="desc" fill="#94a3b8">Not a usability problem</text>
    <text x="24" y="78" font-family="'Segoe UI', sans-serif" font-size="11" fill="#84cc16">1</text>
    <text x="40" y="78" class="desc" fill="#94a3b8">Cosmetic only</text>
    <text x="24" y="102" font-family="'Segoe UI', sans-serif" font-size="11" fill="#f59e0b">2</text>
    <text x="40" y="102" class="desc" fill="#94a3b8">Minor &mdash; low priority</text>
    <text x="24" y="126" font-family="'Segoe UI', sans-serif" font-size="11" fill="#f97316">3</text>
    <text x="40" y="126" class="desc" fill="#94a3b8">Major &mdash; important to fix</text>
    <text x="24" y="150" font-family="'Segoe UI', sans-serif" font-size="11" fill="#dc2626">4</text>
    <text x="40" y="150" class="desc" fill="#94a3b8">Catastrophic &mdash; block release</text>
  </g>

  <!-- Cognitive walkthrough -->
  <g transform="translate(40, 295)">
    <rect x="0" y="0" width="350" height="90" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <text x="18" y="30" class="label" fill="#fbbf24">Cognitive Walkthrough</text>
    <text x="20" y="54" class="desc" fill="#94a3b8">&bull; Step through a task from the user&rsquo;s perspective</text>
    <text x="20" y="72" class="desc" fill="#94a3b8">&bull; Will the user notice &amp; understand each action?</text>
  </g>

  <g transform="translate(410, 295)">
    <rect x="0" y="0" width="350" height="90" rx="12" fill="#1e293b" stroke="#ec4899" stroke-width="2" />
    <text x="18" y="30" class="label" fill="#f472b6">Limitations</text>
    <text x="20" y="54" class="desc" fill="#94a3b8">&bull; Experts may not match real users&rsquo; mental models</text>
    <text x="20" y="72" class="desc" fill="#94a3b8">&bull; Complements &mdash; never replaces &mdash; user testing</text>
  </g>
</svg>
