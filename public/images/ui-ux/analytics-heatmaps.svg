<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; fill: #f8fafc; font-size: 24px; }
    .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; font-size: 14px; }
    .label { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 13px; }
    .desc { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; fill: #94a3b8; }
  </style>

  <rect width="100%" height="100%" rx="16" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <text x="40" y="50" class="title">Analytics &amp; Heatmaps</text>
  <text x="40" y="75" class="subtitle">Watch what users actually do with quantitative tools</text>

  <!-- Analytics -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="350" height="150" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <text x="18" y="30" class="label" fill="#60a5fa">Analytics (quantitative)</text>
    <!-- KPI cards -->
    <rect x="20" y="44" width="95" height="40" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="67" y="60" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#f8fafc" font-weight="700">64%</text>
    <text x="67" y="76" text-anchor="middle" class="desc" fill="#94a3b8">Bounce rate</text>
    <rect x="127" y="44" width="95" height="40" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="174" y="60" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#f8fafc" font-weight="700">3.2s</text>
    <text x="174" y="76" text-anchor="middle" class="desc" fill="#94a3b8">Session time</text>
    <rect x="234" y="44" width="95" height="40" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="281" y="60" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#f8fafc" font-weight="700">2.8%</text>
    <text x="281" y="76" text-anchor="middle" class="desc" fill="#94a3b8">Conversion</text>
    <!-- funnel -->
    <rect x="40" y="98" width="270" height="18" rx="5" fill="#3b82f6" opacity="0.9" />
    <text x="175" y="112" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#fff">10,000 visited</text>
    <rect x="70" y="120" width="210" height="18" rx="5" fill="#3b82f6" opacity="0.7" />
    <text x="175" y="134" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#fff">4,200 signed up</text>
    <text x="20" y="152" class="desc" fill="#64748b">Funnels show exactly where users drop off</text>
  </g>

  <!-- Heatmaps -->
  <g transform="translate(410, 100)">
    <rect x="0" y="0" width="350" height="150" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="18" y="30" class="label" fill="#34d399">Heatmaps (visual)</text>
    <rect x="24" y="44" width="302" height="80" rx="8" fill="#0f172a" stroke="#334155" />
    <!-- heat blobs -->
    <circle cx="110" cy="68" r="16" fill="#ef4444" opacity="0.9" />
    <circle cx="130" cy="70" r="14" fill="#f97316" opacity="0.9" />
    <circle cx="150" cy="80" r="12" fill="#f59e0b" opacity="0.8" />
    <circle cx="170" cy="92" r="12" fill="#fbbf24" opacity="0.7" />
    <circle cx="200" cy="102" r="12" fill="#fde047" opacity="0.6" />
    <circle cx="230" cy="108" r="12" fill="#bef264" opacity="0.5" />
    <circle cx="110" cy="110" r="10" fill="#f97316" opacity="0.6" />
    <!-- click map legend -->
    <text x="40" y="120" class="desc" fill="#94a3b8">Red = most clicked</text>
    <text x="220" y="120" class="desc" fill="#94a3b8">Green = least</text>
    <text x="18" y="145" class="desc" fill="#64748b">Click maps, scroll maps, move maps</text>
  </g>

  <!-- Tools -->
  <g transform="translate(40, 275)">
    <rect x="0" y="0" width="350" height="110" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <text x="18" y="30" class="label" fill="#fbbf24">Popular Tools</text>
    <text x="20" y="56" class="desc" fill="#94a3b8">&bull; Google Analytics / Mixpanel / Amplitude</text>
    <text x="20" y="74" class="desc" fill="#94a3b8">&bull; Hotjar / FullStory / LogRocket</text>
    <text x="20" y="92" class="desc" fill="#94a3b8">&bull; Session recordings + rage click detection</text>
  </g>

  <g transform="translate(410, 275)">
    <rect x="0" y="0" width="350" height="110" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" />
    <text x="18" y="30" class="label" fill="#a78bfa">Funnel Analysis</text>
    <rect x="20" y="44" width="310" height="12" rx="6" fill="#0f172a" stroke="#334155" />
    <rect x="20" y="44" width="200" height="12" rx="6" fill="#8b5cf6" />
    <text x="20" y="72" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Find the step with the biggest drop-off</text>
    <text x="20" y="90" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">then investigate why users leave</text>
  </g>
</svg>
