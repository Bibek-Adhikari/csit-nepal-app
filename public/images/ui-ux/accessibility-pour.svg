<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgGrad)" />
  <rect width="800" height="450" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Header -->
  <text x="40" y="45" font-family="system-ui, sans-serif" font-weight="700" fill="#f8fafc" font-size="22">WCAG &amp; Accessibility (a11y)</text>
  <text x="40" y="68" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="13">POUR principles for inclusive design</text>

  <!-- P - Perceivable -->
  <rect x="40" y="95" width="160" height="200" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
  <text x="120" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" fill="#3b82f6" font-size="42">P</text>
  <text x="120" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#60a5fa" font-size="15">Perceivable</text>
  <text x="120" y="205" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="11">Text alternatives</text>
  <text x="120" y="225" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="11">Captions &amp; transcripts</text>
  <text x="120" y="245" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="11">Color not only cue</text>
  <text x="120" y="265" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="11">Resizable text</text>

  <!-- O - Operable -->
  <rect x="220" y="95" width="160" height="200" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" />
  <text x="300" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" fill="#10b981" font-size="42">O</text>
  <text x="300" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#34d399" font-size="15">Operable</text>
  <text x="300" y="205" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="11">Keyboard accessible</text>
  <text x="300" y="225" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="11">Enough time</text>
  <text x="300" y="245" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="11">No seizures</text>
  <text x="300" y="265" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="11">Navigable</text>

  <!-- U - Understandable -->
  <rect x="400" y="95" width="160" height="200" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
  <text x="480" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" fill="#f59e0b" font-size="42">U</text>
  <text x="480" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#fbbf24" font-size="15">Understandable</text>
  <text x="480" y="205" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="11">Readable text</text>
  <text x="480" y="225" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="11">Predictable UI</text>
  <text x="480" y="245" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="11">Input assistance</text>
  <text x="480" y="265" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="11">Error prevention</text>

  <!-- R - Robust -->
  <rect x="580" y="95" width="160" height="200" rx="12" fill="#1e293b" stroke="#ec4899" stroke-width="2" />
  <text x="660" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" fill="#ec4899" font-size="42">R</text>
  <text x="660" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#f472b6" font-size="15">Robust</text>
  <text x="660" y="205" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="11">Compatible</text>
  <text x="660" y="225" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="11">Valid markup</text>
  <text x="660" y="245" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="11">ARIA labels</text>
  <text x="660" y="265" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="11">Assistive tech</text>

  <!-- Bottom: Stats -->
  <rect x="150" y="330" width="500" height="65" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="400" y="356" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#f8fafc" font-size="14">15% of the world's population experiences some form of disability</text>
  <text x="400" y="378" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="11">Designing accessible products benefits everyone, not just users with disabilities</text>
</svg>