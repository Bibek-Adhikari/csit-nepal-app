<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; fill: #f8fafc; font-size: 24px; }
    .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; font-size: 14px; }
    .label { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 12px; }
    .desc { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; fill: #94a3b8; }
  </style>

  <rect width="100%" height="100%" rx="16" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <text x="40" y="50" class="title">User Flows &amp; Task Analysis</text>
  <text x="40" y="75" class="subtitle">Map every step a user takes to reach their goal</text>

  <!-- Flow diagram -->
  <g transform="translate(40, 100)">
    <!-- start -->
    <ellipse cx="60" cy="150" rx="34" ry="20" fill="#0f172a" stroke="#3b82f6" stroke-width="2" />
    <text x="60" y="155" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#60a5fa">Start</text>
    <line x1="94" y1="150" x2="126" y2="150" stroke="#475569" stroke-width="2" />
    <polygon points="128,150 123,146 123,154" fill="#475569" />

    <!-- screen -->
    <rect x="130" y="116" width="110" height="68" rx="8" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <rect x="140" y="128" width="44" height="10" rx="3" fill="#334155" />
    <rect x="140" y="146" width="70" height="10" rx="3" fill="#475569" />
    <rect x="140" y="162" width="40" height="10" rx="3" fill="#475569" />
    <text x="185" y="100" text-anchor="middle" class="desc" fill="#94a3b8">Screen</text>

    <line x1="240" y1="150" x2="272" y2="150" stroke="#475569" stroke-width="2" />
    <polygon points="274,150 269,146 269,154" fill="#475569" />

    <!-- decision -->
    <polygon points="360,150 320,112 360,74 400,112" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
    <text x="360" y="150" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#fbbf24">Valid?</text>
    <line x1="400" y1="112" x2="430" y2="84" stroke="#475569" stroke-width="2" />
    <line x1="400" y1="150" x2="470" y2="150" stroke="#475569" stroke-width="2" />
    <text x="418" y="80" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">No</text>
    <text x="432" y="140" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">Yes</text>

    <!-- error screen (No branch) -->
    <rect x="430" y="52" width="100" height="60" rx="8" fill="#0f172a" stroke="#dc2626" stroke-width="1.5" />
    <text x="480" y="76" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#f87171">Error</text>
    <text x="480" y="92" text-anchor="middle" class="desc" fill="#64748b">retry / fix</text>
    <path d="M480 112 v24 h-52" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" />
    <polygon points="428,136 433,131 433,141" fill="#64748b" />

    <!-- success screen (Yes branch) -->
    <rect x="470" y="120" width="120" height="70" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <circle cx="498" cy="145" r="9" fill="#10b981" />
    <path d="M494 145 l3 3 l5 -7" fill="none" stroke="#fff" stroke-width="2" />
    <text x="514" y="149" font-family="'Segoe UI', sans-serif" font-size="10" fill="#34d399">Success</text>
    <text x="482" y="172" class="desc" fill="#64748b">goal completed</text>
    <line x1="590" y1="155" x2="640" y2="155" stroke="#475569" stroke-width="2" />
    <ellipse cx="680" cy="155" rx="34" ry="20" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <text x="680" y="160" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#34d399">End</text>
  </g>

  <g transform="translate(40, 265)">
    <rect x="0" y="0" width="720" height="120" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" />
    <text x="18" y="30" class="label" fill="#a78bfa">Happy path, edge cases &amp; task analysis</text>
    <rect x="20" y="44" width="150" height="56" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="95" y="64" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Happy path</text>
    <text x="95" y="82" text-anchor="middle" class="desc" fill="#64748b">ideal, error-free flow</text>
    <rect x="184" y="44" width="170" height="56" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="269" y="64" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Edge cases</text>
    <text x="269" y="82" text-anchor="middle" class="desc" fill="#64748b">empty, error, boundary states</text>
    <rect x="368" y="44" width="150" height="56" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="443" y="64" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Task analysis</text>
    <text x="443" y="82" text-anchor="middle" class="desc" fill="#64748b">break tasks into steps</text>
    <text x="532" y="60" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Tools: Miro,</text>
    <text x="532" y="78" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Whimsical,</text>
    <text x="532" y="96" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">FigmaJam</text>
  </g>
</svg>
