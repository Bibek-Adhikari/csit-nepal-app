<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; fill: #f8fafc; font-size: 24px; }
    .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; font-size: 14px; }
    .size { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; fill: #f8fafc; }
    .label { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
  </style>

  <rect width="100%" height="100%" rx="16" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <text x="40" y="50" class="title">Typography in UI</text>
  <text x="40" y="75" class="subtitle">A modular type scale keeps every interface readable and balanced</text>

  <!-- Big Aa glyph -->
  <rect x="40" y="105" width="200" height="270" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
  <text x="140" y="280" text-anchor="middle" font-family="Georgia, serif" font-weight="800" fill="#60a5fa" font-size="170">Aa</text>
  <text x="140" y="345" text-anchor="middle" class="label">Sans-serif base = 16px body</text>

  <!-- Type scale -->
  <g transform="translate(280, 105)">
    <rect x="0" y="0" width="480" height="270" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="20" y="36" font-family="'Segoe UI', sans-serif" font-weight="700" fill="#34d399" font-size="15">Type Scale (modular)</text>

    <text x="24" y="72" class="size" font-size="30">48</text>
    <text x="95" y="72" class="label" font-size="13">Display / Hero</text>
    <text x="24" y="112" class="size" font-size="24">32</text>
    <text x="95" y="112" class="label" font-size="13">Headline (H1)</text>
    <text x="24" y="148" class="size" font-size="20">24</text>
    <text x="95" y="148" class="label" font-size="13">Section title (H2)</text>
    <text x="24" y="180" class="size" font-size="16">16</text>
    <text x="95" y="180" class="label" font-size="13">Body (base)</text>
    <text x="24" y="212" class="size" font-size="14">14</text>
    <text x="95" y="212" class="label" font-size="13">Secondary / caption</text>
    <text x="24" y="242" class="size" font-size="12">12</text>
    <text x="95" y="242" class="label" font-size="13">Labels &amp; helper</text>
  </g>

  <!-- Footer tips -->
  <text x="40" y="415" font-family="'Segoe UI', sans-serif" font-size="12" fill="#64748b">Line height 1.4&ndash;1.6x &nbsp;&middot;&nbsp; 50&ndash;75 chars per line &nbsp;&middot;&nbsp; Limit to 2&ndash;3 font families</text>
</svg>
