<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; fill: #f8fafc; font-size: 24px; }
    .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; font-size: 14px; }
    .label { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 13px; }
    .desc { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; fill: #94a3b8; }
  </style>

  <rect width="100%" height="100%" rx="16" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <text x="40" y="50" class="title">Responsive Design</text>
  <text x="40" y="75" class="subtitle">One design that adapts across every screen &mdash; mobile first</text>

  <!-- Mobile -->
  <g transform="translate(60, 105)">
    <rect x="0" y="0" width="190" height="250" rx="16" fill="#0f172a" stroke="#3b82f6" stroke-width="2" />
    <rect x="70" y="8" width="50" height="8" rx="4" fill="#1e293b" />
    <rect x="25" y="30" width="140" height="10" rx="4" fill="#3b82f6" />
    <rect x="25" y="50" width="120" height="8" rx="4" fill="#334155" />
    <rect x="25" y="66" width="140" height="90" rx="6" fill="#1e293b" stroke="#334155" />
    <rect x="35" y="78" width="55" height="55" rx="6" fill="#1e293b" stroke="#3b82f6" />
    <rect x="98" y="78" width="55" height="25" rx="4" fill="#1e293b" stroke="#334155" />
    <rect x="98" y="110" width="55" height="25" rx="4" fill="#1e293b" stroke="#334155" />
    <rect x="25" y="166" width="140" height="8" rx="4" fill="#334155" />
    <rect x="25" y="182" width="140" height="8" rx="4" fill="#334155" />
    <rect x="25" y="216" width="140" height="18" rx="9" fill="#3b82f6" />
    <text x="95" y="310" text-anchor="middle" class="label" fill="#60a5fa">Mobile &lt; 768px</text>
    <text x="95" y="328" text-anchor="middle" class="desc">Single column, 44px touch targets</text>
  </g>

  <!-- Tablet -->
  <g transform="translate(305, 105)">
    <rect x="0" y="0" width="190" height="250" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <rect x="70" y="8" width="50" height="8" rx="4" fill="#1e293b" />
    <rect x="25" y="30" width="140" height="10" rx="4" fill="#10b981" />
    <rect x="25" y="50" width="60" height="8" rx="4" fill="#334155" />
    <rect x="95" y="50" width="70" height="8" rx="4" fill="#334155" />
    <rect x="25" y="66" width="66" height="100" rx="6" fill="#1e293b" stroke="#334155" />
    <rect x="99" y="66" width="66" height="100" rx="6" fill="#1e293b" stroke="#334155" />
    <rect x="25" y="176" width="140" height="8" rx="4" fill="#334155" />
    <rect x="25" y="192" width="140" height="8" rx="4" fill="#334155" />
    <rect x="25" y="216" width="140" height="18" rx="9" fill="#10b981" />
    <text x="95" y="310" text-anchor="middle" class="label" fill="#34d399">Tablet 768px</text>
    <text x="95" y="328" text-anchor="middle" class="desc">8-column grid, two panels</text>
  </g>

  <!-- Desktop -->
  <g transform="translate(550, 105)">
    <rect x="0" y="0" width="190" height="250" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
    <rect x="70" y="8" width="50" height="8" rx="4" fill="#1e293b" />
    <rect x="25" y="30" width="140" height="10" rx="4" fill="#f59e0b" />
    <rect x="25" y="50" width="40" height="8" rx="4" fill="#334155" />
    <rect x="72" y="50" width="40" height="8" rx="4" fill="#334155" />
    <rect x="119" y="50" width="46" height="8" rx="4" fill="#334155" />
    <rect x="25" y="66" width="43" height="100" rx="6" fill="#1e293b" stroke="#334155" />
    <rect x="76" y="66" width="43" height="100" rx="6" fill="#1e293b" stroke="#334155" />
    <rect x="127" y="66" width="38" height="100" rx="6" fill="#1e293b" stroke="#334155" />
    <rect x="25" y="176" width="140" height="8" rx="4" fill="#334155" />
    <rect x="25" y="192" width="140" height="8" rx="4" fill="#334155" />
    <rect x="25" y="216" width="140" height="18" rx="9" fill="#f59e0b" />
    <text x="95" y="310" text-anchor="middle" class="label" fill="#fbbf24">Desktop 1024px+</text>
    <text x="95" y="328" text-anchor="middle" class="desc">12-column grid, full layout</text>
  </g>

  <text x="400" y="400" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="600" fill="#64748b" font-size="12">Breakpoints &middot; Fluid layouts &middot; Media queries &middot; srcset images</text>
</svg>
