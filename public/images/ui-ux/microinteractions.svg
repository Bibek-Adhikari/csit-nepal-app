<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgGrad)" />
  <rect width="800" height="450" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Header -->
  <text x="40" y="45" font-family="system-ui, sans-serif" font-weight="700" fill="#f8fafc" font-size="22">Microinteractions</text>
  <text x="40" y="68" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="13">Small moments that improve UX through feedback and delight</text>

  <!-- 4 Cards in a row -->
  <!-- Card 1: Trigger -->
  <rect x="30" y="95" width="160" height="130" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
  <text x="110" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#60a5fa" font-size="15">Trigger</text>
  <text x="110" y="150" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="11">User action</text>
  <text x="110" y="170" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="11">System event</text>
  <text x="110" y="190" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="11">Time-based</text>

  <!-- Arrow 1 -->
  <line x1="195" y1="160" x2="215" y2="160" stroke="#475569" stroke-width="2" />
  <polygon points="217,160 212,156 212,164" fill="#475569" />

  <!-- Card 2: Rules -->
  <rect x="220" y="95" width="160" height="130" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" />
  <text x="300" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#34d399" font-size="15">Rules</text>
  <text x="300" y="150" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="11">What happens</text>
  <text x="300" y="170" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="11">Conditions</text>
  <text x="300" y="190" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="11">Sequence</text>

  <!-- Arrow 2 -->
  <line x1="385" y1="160" x2="405" y2="160" stroke="#475569" stroke-width="2" />
  <polygon points="407,160 402,156 402,164" fill="#475569" />

  <!-- Card 3: Feedback -->
  <rect x="410" y="95" width="160" height="130" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
  <text x="490" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#fbbf24" font-size="15">Feedback</text>
  <text x="490" y="150" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="11">Visual change</text>
  <text x="490" y="170" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="11">Sound/haptics</text>
  <text x="490" y="190" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="11">Animation</text>

  <!-- Arrow 3 -->
  <line x1="575" y1="160" x2="595" y2="160" stroke="#475569" stroke-width="2" />
  <polygon points="597,160 592,156 592,164" fill="#475569" />

  <!-- Card 4: Loops -->
  <rect x="600" y="95" width="170" height="130" rx="12" fill="#1e293b" stroke="#ec4899" stroke-width="2" />
  <text x="685" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#f472b6" font-size="15">Loops</text>
  <text x="685" y="150" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="11">Repeat</text>
  <text x="685" y="170" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="11">Duration</text>
  <text x="685" y="190" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="11">Meta-rules</text>

  <!-- Examples Row -->
  <!-- Like button -->
  <rect x="50" y="270" width="150" height="55" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <circle cx="75" cy="297" r="14" fill="#ef4444" />
  <text x="75" y="301" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#fff" font-size="13">&#9829;</text>
  <text x="100" y="301" font-family="system-ui, sans-serif" font-weight="600" fill="#f1f5f9" font-size="13">Like button</text>

  <!-- Success toast -->
  <rect x="220" y="270" width="150" height="55" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <circle cx="245" cy="297" r="14" fill="#10b981" />
  <text x="245" y="301" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#fff" font-size="13">&#10003;</text>
  <text x="270" y="301" font-family="system-ui, sans-serif" font-weight="600" fill="#f1f5f9" font-size="13">Success toast</text>

  <!-- Pull to refresh -->
  <rect x="390" y="270" width="150" height="55" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <circle cx="415" cy="297" r="14" fill="#3b82f6" />
  <text x="415" y="301" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#fff" font-size="13">&#8644;</text>
  <text x="440" y="301" font-family="system-ui, sans-serif" font-weight="600" fill="#f1f5f9" font-size="13">Pull to refresh</text>

  <!-- Toggle switch -->
  <rect x="560" y="270" width="150" height="55" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <circle cx="585" cy="297" r="14" fill="#f59e0b" />
  <text x="585" y="301" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#fff" font-size="13">&#9729;</text>
  <text x="610" y="301" font-family="system-ui, sans-serif" font-weight="600" fill="#f1f5f9" font-size="13">Toggle switch</text>
</svg>