<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="visceralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="behavioralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="reflectiveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6b21a8" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; fill: #f8fafc; font-size: 24px; }
    .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; font-size: 14px; }
    .level { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; font-size: 18px; }
    .label { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 14px; }
    .desc { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #cbd5e1; }
  </style>

  <rect width="100%" height="100%" rx="16" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <text x="40" y="50" class="title">Don Norman's 3 Levels of Emotional Design</text>
  <text x="40" y="75" class="subtitle">How users emotionally connect with products at different levels</text>

  <!-- Visceral (Bottom - widest) -->
  <g transform="translate(80, 280)">
    <rect x="0" y="0" width="640" height="130" rx="12" fill="url(#visceralGrad)" stroke="#ef4444" stroke-width="2" />
    <text x="320" y="35" text-anchor="middle" class="level" fill="#ef4444">VISCERAL</text>
    <text x="320" y="58" text-anchor="middle" class="label" fill="#fca5a5">Immediate, automatic reaction</text>
    <text x="320" y="80" text-anchor="middle" class="desc">Appearance, first impressions, gut feeling</text>
    <text x="320" y="100" text-anchor="middle" class="desc">Does it look premium? Is it visually appealing? First glance.</text>
  </g>

  <!-- Behavioral (Middle) -->
  <g transform="translate(140, 180)">
    <rect x="0" y="0" width="520" height="90" rx="12" fill="url(#behavioralGrad)" stroke="#3b82f6" stroke-width="2" />
    <text x="260" y="30" text-anchor="middle" class="level" fill="#3b82f6">BEHAVIORAL</text>
    <text x="260" y="52" text-anchor="middle" class="label" fill="#93c5fd">Pleasure and effectiveness of use</text>
    <text x="260" y="72" text-anchor="middle" class="desc">Usability, functionality, satisfaction during interaction</text>
  </g>

  <!-- Reflective (Top - narrowest) -->
  <g transform="translate(200, 100)">
    <rect x="0" y="0" width="400" height="70" rx="12" fill="url(#reflectiveGrad)" stroke="#a855f7" stroke-width="2" />
    <text x="200" y="30" text-anchor="middle" class="level" fill="#a855f7">REFLECTIVE</text>
    <text x="200" y="52" text-anchor="middle" class="label" fill="#d8b4fe">Self-image, memories, meaning</text>
  </g>
</svg>