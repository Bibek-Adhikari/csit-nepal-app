<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgGrad)" />
  <rect width="800" height="450" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <text x="40" y="45" font-family="system-ui, sans-serif" font-weight="700" fill="#f8fafc" font-size="22">Interaction Models</text>
  <text x="40" y="68" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="13">Different paradigms for human-computer interaction</text>

  <!-- WIMP -->
  <rect x="40" y="95" width="160" height="140" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
  <text x="120" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#60a5fa" font-size="15">WIMP</text>
  <text x="120" y="150" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Windows, Icons</text>
  <text x="120" y="168" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Menus, Pointer</text>
  <text x="120" y="195" text-anchor="middle" font-family="system-ui, sans-serif" fill="#cbd5e1" font-size="10">Desktop paradigm</text>
  <text x="120" y="215" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Traditional</text>

  <!-- NUI -->
  <rect x="240" y="95" width="160" height="140" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
  <text x="320" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#34d399" font-size="15">NUI</text>
  <text x="320" y="150" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Natural User</text>
  <text x="320" y="168" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Interface</text>
  <text x="320" y="195" text-anchor="middle" font-family="system-ui, sans-serif" fill="#cbd5e1" font-size="10">Touch, Gesture</text>
  <text x="320" y="215" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Voice control</text>

  <!-- Conversational UI -->
  <rect x="440" y="95" width="160" height="140" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
  <text x="520" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#fbbf24" font-size="15">Conversational</text>
  <text x="520" y="150" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Chatbots, Voice</text>
  <text x="520" y="168" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Assistants</text>
  <text x="520" y="195" text-anchor="middle" font-family="system-ui, sans-serif" fill="#cbd5e1" font-size="10">Alexa, Siri</text>
  <text x="520" y="215" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Messaging</text>

  <!-- Spatial UI -->
  <rect x="640" y="95" width="130" height="140" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
  <text x="705" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#f472b6" font-size="15">Spatial</text>
  <text x="705" y="150" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">AR / VR</text>
  <text x="705" y="168" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">3D Objects</text>
  <text x="705" y="195" text-anchor="middle" font-family="system-ui, sans-serif" fill="#cbd5e1" font-size="10">Gaze, Controller</text>
  <text x="705" y="215" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Emerging</text>

  <!-- Bottom: Combined -->
  <rect x="40" y="270" width="730" height="100" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" />
  <text x="405" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#a78bfa" font-size="14">Modern Products Combine Multiple Models</text>
  <text x="405" y="325" text-anchor="middle" font-family="system-ui, sans-serif" fill="#cbd5e1" font-size="11">Example: A smartphone uses WIMP (desktop mode), NUI (touch), Conversational (Siri), and Spatial (AR apps)</text>
  <text x="405" y="348" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="11">Each model has different affordances, constraints, and design considerations.</text>
</svg>