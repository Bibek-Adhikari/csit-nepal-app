<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; fill: #f8fafc; font-size: 24px; }
    .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; font-size: 14px; }
    .label { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 14px; }
    .desc { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; fill: #94a3b8; }
  </style>

  <rect width="100%" height="100%" rx="16" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <text x="40" y="50" class="title">Inclusive Design</text>
  <text x="40" y="75" class="subtitle">Design for the widest range of people, every kind of user benefits</text>

  <g transform="translate(40, 105)">
    <rect x="0" y="0" width="720" height="130" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <text x="360" y="30" text-anchor="middle" class="label" fill="#60a5fa">The Persona Spectrum</text>

    <text x="150" y="56" text-anchor="middle" class="desc" fill="#94a3b8">Permanent</text>
    <text x="360" y="56" text-anchor="middle" class="desc" fill="#94a3b8">Temporary</text>
    <text x="570" y="56" text-anchor="middle" class="desc" fill="#94a3b8">Situational</text>

    <text x="70" y="84" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">One arm</text>
    <text x="70" y="110" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Blind</text>
    <text x="70" y="136" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Deaf</text>

    <rect x="150" y="72" width="110" height="16" rx="8" fill="#1e3a5f" />
    <rect x="150" y="98" width="110" height="16" rx="8" fill="#1e3a5f" />
    <rect x="150" y="124" width="110" height="16" rx="8" fill="#1e3a5f" />

    <rect x="360" y="72" width="110" height="16" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1" />
    <text x="415" y="84" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#60a5fa">Arm injury</text>
    <rect x="360" y="98" width="110" height="16" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1" />
    <text x="415" y="110" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#60a5fa">Cataract</text>
    <rect x="360" y="124" width="110" height="16" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1" />
    <text x="415" y="136" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#60a5fa">Ear infection</text>

    <rect x="570" y="72" width="110" height="16" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1" />
    <text x="625" y="84" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#60a5fa">Holding a baby</text>
    <rect x="570" y="98" width="110" height="16" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1" />
    <text x="625" y="110" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#60a5fa">Bright sunlight</text>
    <rect x="570" y="124" width="110" height="16" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1" />
    <text x="625" y="136" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#60a5fa">Noisy room</text>
  </g>

  <g transform="translate(40, 255)">
    <rect x="0" y="0" width="350" height="130" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="18" y="30" class="label" fill="#34d399">Inclusive Design Practices</text>
    <rect x="20" y="44" width="140" height="28" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="90" y="62" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Larger touch targets</text>
    <rect x="176" y="44" width="150" height="28" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="251" y="62" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Higher color contrast</text>
    <rect x="20" y="82" width="140" height="28" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="90" y="100" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">RTL language support</text>
    <rect x="176" y="82" width="150" height="28" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="251" y="100" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Simpler navigation</text>
    <text x="18" y="124" class="desc" fill="#64748b">Designing for permanent disabilities helps everyone.</text>
  </g>

  <g transform="translate(410, 255)">
    <rect x="0" y="0" width="350" height="130" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" />
    <text x="18" y="30" class="label" fill="#a78bfa">Disability Types</text>
    <circle cx="70" cy="80" r="26" fill="#0f172a" stroke="#334155" />
    <text x="70" y="86" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#f8fafc" font-weight="700">A</text>
    <circle cx="175" cy="80" r="26" fill="#0f172a" stroke="#334155" />
    <text x="175" y="86" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#f8fafc" font-weight="700">B</text>
    <circle cx="280" cy="80" r="26" fill="#0f172a" stroke="#334155" />
    <text x="280" y="86" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#f8fafc" font-weight="700">C</text>
    <text x="70" y="118" text-anchor="middle" class="desc" fill="#94a3b8">Visual</text>
    <text x="175" y="118" text-anchor="middle" class="desc" fill="#94a3b8">Motor</text>
    <text x="280" y="118" text-anchor="middle" class="desc" fill="#94a3b8">Cognitive</text>
    <text x="18" y="60" class="desc" fill="#64748b">Permanent, temporary, situational</text>
  </g>
</svg>
