<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; fill: #f8fafc; font-size: 24px; }
    .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; font-size: 14px; }
    .label { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 13px; }
    .desc { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; fill: #94a3b8; }
  </style>

  <rect width="100%" height="100%" rx="16" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <text x="40" y="50" class="title">Usability Testing</text>
  <text x="40" y="75" class="subtitle">Watch real users complete real tasks &mdash; find friction before launch</text>

  <!-- Moderated -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="350" height="150" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <text x="18" y="30" class="label" fill="#60a5fa">Moderated</text>
    <!-- user -->
    <circle cx="80" cy="95" r="22" fill="#0f172a" stroke="#3b82f6" stroke-width="2" />
    <circle cx="80" cy="90" r="8" fill="#3b82f6" />
    <path d="M60 118 a20 20 0 0 1 40 0 z" fill="#3b82f6" />
    <!-- screen -->
    <rect x="130" y="56" width="120" height="80" rx="6" fill="#0f172a" stroke="#475569" />
    <rect x="140" y="68" width="50" height="8" rx="3" fill="#334155" />
    <rect x="140" y="86" width="80" height="20" rx="3" fill="#334155" />
    <rect x="140" y="114" width="60" height="10" rx="3" fill="#475569" />
    <!-- facilitator -->
    <circle cx="300" cy="95" r="22" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <circle cx="300" cy="90" r="8" fill="#10b981" />
    <path d="M280 118 a20 20 0 0 1 40 0 z" fill="#10b981" />
    <text x="80" y="80" text-anchor="middle" class="desc" fill="#94a3b8">User</text>
    <text x="190" y="48" text-anchor="middle" class="desc" fill="#94a3b8">Task</text>
    <text x="300" y="80" text-anchor="middle" class="desc" fill="#94a3b8">Facilitator</text>
    <text x="18" y="140" class="desc" fill="#64748b">Facilitator guides, observes &amp; asks follow-ups</text>
  </g>

  <!-- Unmoderated -->
  <g transform="translate(410, 100)">
    <rect x="0" y="0" width="350" height="150" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="18" y="30" class="label" fill="#34d399">Unmoderated</text>
    <circle cx="80" cy="95" r="22" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <circle cx="80" cy="90" r="8" fill="#10b981" />
    <path d="M60 118 a20 20 0 0 1 40 0 z" fill="#10b981" />
    <rect x="130" y="56" width="120" height="80" rx="6" fill="#0f172a" stroke="#475569" />
    <rect x="140" y="68" width="50" height="8" rx="3" fill="#334155" />
    <rect x="140" y="86" width="80" height="20" rx="3" fill="#334155" />
    <rect x="140" y="114" width="60" height="10" rx="3" fill="#475569" />
    <circle cx="300" cy="95" r="22" fill="#0f172a" stroke="#8b5cf6" stroke-width="2" />
    <path d="M288 88 l8 10 l16 -18" fill="none" stroke="#a78bfa" stroke-width="2.5" />
    <text x="80" y="80" text-anchor="middle" class="desc" fill="#94a3b8">User</text>
    <text x="300" y="80" text-anchor="middle" class="desc" fill="#94a3b8">Tool</text>
    <text x="18" y="140" class="desc" fill="#64748b">Users test alone via tools like UserTesting / Maze</text>
  </g>

  <!-- Think aloud -->
  <g transform="translate(40, 275)">
    <rect x="0" y="0" width="350" height="110" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <text x="18" y="30" class="label" fill="#fbbf24">Think-Aloud Protocol</text>
    <rect x="20" y="44" width="310" height="44" rx="8" fill="#0f172a" stroke="#334155" />
    <path d="M38 54 l-8 24 h26 z" fill="none" stroke="#fbbf24" stroke-width="2" />
    <text x="42" y="72" font-family="'Segoe UI', sans-serif" font-size="12" fill="#fbbf24">!</text>
    <text x="70" y="70" font-family="'Segoe UI', sans-serif" font-size="11" fill="#e2e8f0">&ldquo;I&rsquo;m looking for the checkout button... I don&rsquo;t see it&hellip;&rdquo;</text>
  </g>

  <!-- 5 users -->
  <g transform="translate(410, 275)">
    <rect x="0" y="0" width="350" height="110" rx="12" fill="#1e293b" stroke="#ec4899" stroke-width="2" />
    <text x="18" y="30" class="label" fill="#f472b6">Test with 5 users</text>
    <circle cx="60" cy="72" r="18" fill="#0f172a" stroke="#ec4899" stroke-width="2" />
    <text x="60" y="77" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#f472b6" font-weight="700">1</text>
    <circle cx="120" cy="72" r="18" fill="#0f172a" stroke="#ec4899" stroke-width="2" />
    <text x="120" y="77" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#f472b6" font-weight="700">2</text>
    <circle cx="180" cy="72" r="18" fill="#0f172a" stroke="#ec4899" stroke-width="2" />
    <text x="180" y="77" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#f472b6" font-weight="700">3</text>
    <circle cx="240" cy="72" r="18" fill="#0f172a" stroke="#ec4899" stroke-width="2" />
    <text x="240" y="77" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#f472b6" font-weight="700">4</text>
    <circle cx="300" cy="72" r="18" fill="#ec4899" />
    <text x="300" y="77" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#fff" font-weight="700">5</text>
    <text x="18" y="100" class="desc" fill="#64748b">5 users reveal ~85% of usability issues</text>
  </g>
</svg>
