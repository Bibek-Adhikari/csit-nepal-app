<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgGrad)" />
  <rect width="800" height="450" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <text x="40" y="45" font-family="system-ui, sans-serif" font-weight="700" fill="#f8fafc" font-size="22">Affordances &amp; Signifiers</text>
  <text x="40" y="68" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="13">How users understand what actions are possible</text>

  <!-- Affordance -->
  <rect x="40" y="95" width="220" height="140" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
  <text x="150" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#60a5fa" font-size="14">Affordance</text>
  <text x="150" y="150" text-anchor="middle" font-family="system-ui, sans-serif" fill="#cbd5e1" font-size="11">Relationship between object</text>
  <text x="150" y="168" text-anchor="middle" font-family="system-ui, sans-serif" fill="#cbd5e1" font-size="11">and person</text>
  <text x="150" y="195" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Button affords pressing</text>
  <text x="150" y="213" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Handle affords pulling</text>

  <!-- Perceived Affordance -->
  <rect x="290" y="95" width="220" height="140" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
  <text x="400" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#34d399" font-size="14">Perceived</text>
  <text x="400" y="143" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#34d399" font-size="14">Affordance</text>
  <text x="400" y="168" text-anchor="middle" font-family="system-ui, sans-serif" fill="#cbd5e1" font-size="11">What the user THINKS</text>
  <text x="400" y="186" text-anchor="middle" font-family="system-ui, sans-serif" fill="#cbd5e1" font-size="11">they can do</text>
  <text x="400" y="213" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Screen button looks clickable</text>

  <!-- Signifier -->
  <rect x="540" y="95" width="220" height="140" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
  <text x="650" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#fbbf24" font-size="14">Signifier</text>
  <text x="650" y="150" text-anchor="middle" font-family="system-ui, sans-serif" fill="#cbd5e1" font-size="11">Visual or auditory cue</text>
  <text x="650" y="168" text-anchor="middle" font-family="system-ui, sans-serif" fill="#cbd5e1" font-size="11">that communicates action</text>
  <text x="650" y="195" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">Arrows, shadows, color</text>
  <text x="650" y="213" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="10">changes, underlined text</text>

  <!-- Gap explanation -->
  <rect x="40" y="270" width="720" height="90" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" />
  <text x="400" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#a78bfa" font-size="14">The Gap Between Affordance &amp; Perceived Affordance</text>
  <text x="400" y="325" text-anchor="middle" font-family="system-ui, sans-serif" fill="#cbd5e1" font-size="11">Design failures occur when users can't perceive the affordance.</text>
  <text x="400" y="345" text-anchor="middle" font-family="system-ui, sans-serif" fill="#94a3b8" font-size="11">Good signifiers bridge this gap: a button with shadow clearly signals "click me"</text>
</svg>