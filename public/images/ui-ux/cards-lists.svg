<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; fill: #f8fafc; font-size: 24px; }
    .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; font-size: 14px; }
    .cardLabel { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 12px; fill: #94a3b8; }
  </style>

  <rect width="100%" height="100%" rx="16" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <text x="40" y="50" class="title">Content Cards &amp; Lists</text>
  <text x="40" y="75" class="subtitle">Cards for visual browsing, lists for fast scanning</text>

  <!-- Card grid (2 columns) -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="240" height="290" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <text x="120" y="30" text-anchor="middle" class="cardLabel" fill="#60a5fa">CARD GRID</text>
    <!-- card 1 -->
    <rect x="16" y="46" width="100" height="110" rx="8" fill="#0f172a" stroke="#334155" />
    <rect x="16" y="46" width="100" height="42" rx="8" fill="#1e3a5f" />
    <rect x="22" y="96" width="70" height="6" rx="3" fill="#475569" />
    <rect x="22" y="108" width="56" height="6" rx="3" fill="#3b82f6" />
    <rect x="22" y="120" width="84" height="24" rx="5" fill="#1e293b" stroke="#3b82f6" />
    <!-- card 2 -->
    <rect x="124" y="46" width="100" height="110" rx="8" fill="#0f172a" stroke="#334155" />
    <rect x="124" y="46" width="100" height="42" rx="8" fill="#0f2440" />
    <rect x="130" y="96" width="70" height="6" rx="3" fill="#475569" />
    <rect x="130" y="108" width="56" height="6" rx="3" fill="#10b981" />
    <rect x="130" y="120" width="84" height="24" rx="5" fill="#1e293b" stroke="#10b981" />
    <!-- card 3 -->
    <rect x="16" y="164" width="100" height="110" rx="8" fill="#0f172a" stroke="#334155" />
    <rect x="16" y="164" width="100" height="42" rx="8" fill="#3a2540" />
    <rect x="22" y="214" width="70" height="6" rx="3" fill="#475569" />
    <rect x="22" y="226" width="56" height="6" rx="3" fill="#ec4899" />
    <rect x="22" y="238" width="84" height="24" rx="5" fill="#1e293b" stroke="#ec4899" />
    <!-- card 4 -->
    <rect x="124" y="164" width="100" height="110" rx="8" fill="#0f172a" stroke="#334155" />
    <rect x="124" y="164" width="100" height="42" rx="8" fill="#14342a" />
    <rect x="130" y="214" width="70" height="6" rx="3" fill="#475569" />
    <rect x="130" y="226" width="56" height="6" rx="3" fill="#14b8a6" />
    <rect x="130" y="238" width="84" height="24" rx="5" fill="#1e293b" stroke="#14b8a6" />
  </g>

  <!-- List (single column) -->
  <g transform="translate(330, 100)">
    <rect x="0" y="0" width="430" height="290" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="215" y="30" text-anchor="middle" class="cardLabel" fill="#34d399">LIST</text>
    <!-- row 1 -->
    <rect x="16" y="46" width="398" height="40" rx="8" fill="#0f172a" stroke="#334155" />
    <circle cx="42" cy="66" r="13" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <rect x="66" y="56" width="200" height="7" rx="3" fill="#475569" />
    <rect x="66" y="68" width="140" height="6" rx="3" fill="#334155" />
    <circle cx="390" cy="66" r="8" fill="none" stroke="#64748b" stroke-width="2" />
    <!-- row 2 -->
    <rect x="16" y="96" width="398" height="40" rx="8" fill="#0f172a" stroke="#334155" />
    <circle cx="42" cy="116" r="13" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <rect x="66" y="106" width="180" height="7" rx="3" fill="#475569" />
    <rect x="66" y="118" width="120" height="6" rx="3" fill="#334155" />
    <circle cx="390" cy="116" r="8" fill="none" stroke="#64748b" stroke-width="2" />
    <!-- row 3 -->
    <rect x="16" y="146" width="398" height="40" rx="8" fill="#0f172a" stroke="#334155" />
    <circle cx="42" cy="166" r="13" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <rect x="66" y="156" width="220" height="7" rx="3" fill="#475569" />
    <rect x="66" y="168" width="160" height="6" rx="3" fill="#334155" />
    <circle cx="390" cy="166" r="8" fill="none" stroke="#64748b" stroke-width="2" />
    <!-- row 4 -->
    <rect x="16" y="196" width="398" height="40" rx="8" fill="#0f172a" stroke="#334155" />
    <circle cx="42" cy="216" r="13" fill="#1e293b" stroke="#ec4899" stroke-width="2" />
    <rect x="66" y="206" width="190" height="7" rx="3" fill="#475569" />
    <rect x="66" y="218" width="130" height="6" rx="3" fill="#334155" />
    <circle cx="390" cy="216" r="8" fill="none" stroke="#64748b" stroke-width="2" />
    <!-- row 5 -->
    <rect x="16" y="246" width="398" height="34" rx="8" fill="#0f172a" stroke="#334155" />
    <rect x="170" y="258" width="90" height="10" rx="5" fill="#1e293b" stroke="#475569" />
    <text x="215" y="266" text-anchor="middle" class="cardLabel" fill="#64748b" font-size="10">Show more</text>
  </g>

  <text x="400" y="415" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="600" fill="#64748b" font-size="12">Cards: heterogeneous, visual content &nbsp;|&nbsp; Lists: scannable, task-heavy content</text>
</svg>
