<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; fill: #f8fafc; font-size: 24px; }
    .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; font-size: 14px; }
    .label { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 13px; }
    .desc { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; fill: #94a3b8; }
  </style>

  <rect width="100%" height="100%" rx="16" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <text x="40" y="50" class="title">A/B Testing</text>
  <text x="40" y="75" class="subtitle">Let real users choose the winning variant with data, not opinions</text>

  <!-- A vs B -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="350" height="200" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <text x="18" y="30" class="label" fill="#60a5fa">Variant A</text>
    <rect x="24" y="46" width="302" height="20" rx="5" fill="#0f172a" stroke="#334155" />
    <rect x="34" y="52" width="50" height="8" rx="3" fill="#475569" />
    <rect x="24" y="76" width="302" height="56" rx="8" fill="#0f172a" stroke="#334155" />
    <rect x="34" y="86" width="120" height="8" rx="3" fill="#475569" />
    <rect x="34" y="100" width="100" height="8" rx="3" fill="#475569" />
    <rect x="34" y="114" width="200" height="8" rx="3" fill="#475569" />
    <rect x="24" y="146" width="302" height="36" rx="8" fill="#3b82f6" />
    <text x="175" y="169" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#fff" font-weight="700">Sign Up</text>
  </g>

  <g transform="translate(410, 100)">
    <rect x="0" y="0" width="350" height="200" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="18" y="30" class="label" fill="#34d399">Variant B</text>
    <rect x="24" y="46" width="302" height="20" rx="5" fill="#0f172a" stroke="#334155" />
    <rect x="34" y="52" width="60" height="8" rx="3" fill="#475569" />
    <rect x="24" y="76" width="302" height="56" rx="8" fill="#0f172a" stroke="#334155" />
    <rect x="34" y="86" width="140" height="8" rx="3" fill="#475569" />
    <rect x="34" y="100" width="90" height="8" rx="3" fill="#475569" />
    <rect x="34" y="114" width="180" height="8" rx="3" fill="#475569" />
    <rect x="24" y="146" width="302" height="36" rx="8" fill="#10b981" />
    <text x="175" y="169" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#fff" font-weight="700">Create Free Account</text>
    <text x="175" y="188" text-anchor="middle" class="desc" fill="#64748b">test one variable at a time</text>
  </g>

  <!-- VS -->
  <text x="400" y="175" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="800" fill="#f8fafc" font-size="18">VS</text>

  <!-- Hypothesis + significance -->
  <g transform="translate(40, 325)">
    <rect x="0" y="0" width="350" height="60" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <text x="18" y="26" class="label" fill="#fbbf24">Hypothesis first</text>
    <text x="18" y="48" class="desc" fill="#94a3b8">&#8220;Changing the CTA will increase clicks because&#8230;&#8221;</text>
  </g>

  <g transform="translate(410, 325)">
    <rect x="0" y="0" width="350" height="60" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" />
    <text x="18" y="26" class="label" fill="#a78bfa">Statistical significance</text>
    <text x="18" y="48" class="desc" fill="#94a3b8">95%+ confidence &#183; right sample size &#183; 1-2 cycles</text>
  </g>
</svg>
