<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; fill: #f8fafc; font-size: 24px; }
    .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; font-size: 14px; }
    .label { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 13px; }
    .desc { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; fill: #94a3b8; }
  </style>

  <rect width="100%" height="100%" rx="16" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <text x="40" y="50" class="title">Data Display Components</text>
  <text x="40" y="75" class="subtitle">Presenting structured information clearly and scannably</text>

  <!-- Table -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="350" height="170" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <text x="18" y="28" class="label" fill="#60a5fa">Tables</text>
    <rect x="16" y="42" width="318" height="22" rx="4" fill="#0f172a" />
    <rect x="20" y="47" width="70" height="8" rx="3" fill="#3b82f6" />
    <rect x="100" y="47" width="50" height="8" rx="3" fill="#475569" />
    <rect x="160" y="47" width="60" height="8" rx="3" fill="#475569" />
    <rect x="230" y="47" width="50" height="8" rx="3" fill="#475569" />
    <rect x="20" y="72" width="70" height="8" rx="3" fill="#475569" />
    <rect x="100" y="72" width="50" height="8" rx="3" fill="#475569" />
    <rect x="160" y="72" width="60" height="8" rx="3" fill="#475569" />
    <rect x="230" y="72" width="50" height="8" rx="3" fill="#475569" />
    <rect x="20" y="88" width="70" height="8" rx="3" fill="#475569" />
    <rect x="100" y="88" width="50" height="8" rx="3" fill="#475569" />
    <rect x="160" y="88" width="60" height="8" rx="3" fill="#475569" />
    <rect x="230" y="88" width="50" height="8" rx="3" fill="#475569" />
    <rect x="20" y="104" width="70" height="8" rx="3" fill="#475569" />
    <rect x="100" y="104" width="50" height="8" rx="3" fill="#475569" />
    <rect x="160" y="104" width="60" height="8" rx="3" fill="#475569" />
    <rect x="230" y="104" width="50" height="8" rx="3" fill="#475569" />
    <text x="18" y="152" class="desc">Dense, sortable, filterable row &amp; column data.</text>
  </g>

  <!-- Charts -->
  <g transform="translate(410, 100)">
    <rect x="0" y="0" width="350" height="170" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="18" y="28" class="label" fill="#34d399">Charts</text>
    <!-- bar chart -->
    <rect x="40" y="120" width="30" height="40" rx="3" fill="#3b82f6" />
    <rect x="84" y="92" width="30" height="68" rx="3" fill="#10b981" />
    <rect x="128" y="70" width="30" height="90" rx="3" fill="#f59e0b" />
    <rect x="172" y="100" width="30" height="60" rx="3" fill="#ec4899" />
    <line x1="40" y1="130" x2="300" y2="130" stroke="#475569" stroke-width="1.5" />
    <circle cx="240" cy="118" r="5" fill="#8b5cf6" />
    <circle cx="268" cy="94" r="5" fill="#8b5cf6" />
    <circle cx="296" cy="108" r="5" fill="#8b5cf6" />
    <polyline points="240,118 268,94 296,108" fill="none" stroke="#a78bfa" stroke-width="2" />
    <text x="18" y="162" class="desc">Bars compare, lines show trends, pies show parts.</text>
  </g>

  <!-- Badges + tags + progress -->
  <g transform="translate(40, 295)">
    <rect x="0" y="0" width="350" height="95" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <text x="18" y="28" class="label" fill="#fbbf24">Badges &amp; Tags</text>
    <rect x="20" y="42" width="56" height="20" rx="10" fill="#10b981" />
    <text x="48" y="56" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#fff">New</text>
    <rect x="86" y="42" width="56" height="20" rx="10" fill="#f59e0b" />
    <text x="114" y="56" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#0f172a">Beta</text>
    <rect x="152" y="42" width="56" height="20" rx="10" fill="#dc2626" />
    <text x="180" y="56" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#fff">Error</text>
    <rect x="222" y="42" width="60" height="20" rx="10" fill="#0f172a" stroke="#3b82f6" />
    <text x="252" y="56" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#60a5fa">#java</text>
    <text x="18" y="86" class="desc">Status conveyed by color + always a text label.</text>
  </g>

  <g transform="translate(410, 295)">
    <rect x="0" y="0" width="350" height="95" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" />
    <text x="18" y="28" class="label" fill="#a78bfa">Progress Indicators</text>
    <rect x="20" y="44" width="200" height="12" rx="6" fill="#0f172a" stroke="#334155" />
    <rect x="22" y="46" width="120" height="8" rx="4" fill="#8b5cf6" />
    <text x="232" y="54" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">60%</text>
    <circle cx="80" cy="78" r="8" fill="none" stroke="#334155" stroke-width="2.5" />
    <circle cx="80" cy="78" r="8" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="38 12" stroke-linecap="round" />
    <text x="98" y="82" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Determinate (bar)</text>
    <circle cx="280" cy="78" r="8" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="10 10" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 280 78" to="360 280 78" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="298" y="82" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Indeterminate</text>
  </g>
</svg>
