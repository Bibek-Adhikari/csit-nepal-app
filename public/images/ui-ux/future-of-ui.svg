<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; fill: #f8fafc; font-size: 24px; }
    .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; font-size: 14px; }
    .label { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 13px; }
    .desc { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; fill: #94a3b8; }
  </style>

  <rect width="100%" height="100%" rx="16" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <text x="40" y="50" class="title">The Future of UI</text>
  <text x="40" y="75" class="subtitle">Emerging interfaces and where UX design is heading</text>

  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="350" height="130" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="2" />
    <text x="18" y="30" class="label" fill="#c4b5fd">AI &amp; Generative UI</text>
    <text x="20" y="54" class="desc" fill="#94a3b8">&#8226; Interfaces that adapt and generate</text>
    <text x="20" y="72" class="desc" fill="#94a3b8">&#8226; Personalized layouts in real time</text>
    <text x="20" y="90" class="desc" fill="#94a3b8">&#8226; Natural-language commands</text>
    <text x="20" y="108" class="desc" fill="#94a3b8">&#8226; Designers become prompt &amp; system designers</text>
  </g>

  <g transform="translate(410, 100)">
    <rect x="0" y="0" width="350" height="130" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <text x="18" y="30" class="label" fill="#60a5fa">AR &amp; Spatial Computing</text>
    <text x="20" y="54" class="desc" fill="#94a3b8">&#8226; Interfaces in 3D physical space</text>
    <text x="20" y="72" class="desc" fill="#94a3b8">&#8226; Gesture and gaze interaction</text>
    <text x="20" y="90" class="desc" fill="#94a3b8">&#8226; Mixed reality overlays on the world</text>
    <text x="20" y="108" class="desc" fill="#94a3b8">&#8226; New spatial UX patterns to learn</text>
  </g>

  <g transform="translate(40, 255)">
    <rect x="0" y="0" width="350" height="130" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="18" y="30" class="label" fill="#34d399">Multimodal Interfaces</text>
    <text x="20" y="54" class="desc" fill="#94a3b8">&#8226; Combine voice, touch, gesture, gaze</text>
    <text x="20" y="72" class="desc" fill="#94a3b8">&#8226; Seamless switching between modes</text>
    <text x="20" y="90" class="desc" fill="#94a3b8">&#8226; Context-aware proactive assistance</text>
    <text x="20" y="108" class="desc" fill="#94a3b8">&#8226; Accessibility-first by default</text>
  </g>

  <g transform="translate(410, 255)">
    <rect x="0" y="0" width="350" height="130" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <text x="18" y="30" class="label" fill="#fbbf24">Timeless UX principles</text>
    <text x="20" y="54" class="desc" fill="#94a3b8">&#8226; User research and empathy stay core</text>
    <text x="20" y="72" class="desc" fill="#94a3b8">&#8226; Clarity, feedback and forgiveness</text>
    <text x="20" y="90" class="desc" fill="#94a3b8">&#8226; Ethical design and privacy</text>
    <text x="20" y="108" class="desc" fill="#94a3b8">&#8226; Continuous testing and iteration</text>
  </g>
</svg>
