<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Grid Column gradient -->
    <linearGradient id="colGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.03" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; fill: #f8fafc; font-size: 24px; }
    .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; font-size: 14px; }
    .label { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; fill: #f1f5f9; font-size: 14px; }
    .desc { font-family: 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; font-size: 11px; }
    .grid-num { font-family: 'Fira Code', monospace; fill: #ef4444; font-size: 11px; font-weight: 700; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" rx="16" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Header -->
  <text x="40" y="50" class="title">Responsive Grid System</text>
  <text x="40" y="75" class="subtitle">Standard 12-Column Layout Grid for UI Consistency &amp; Alignment</text>

  <!-- Column Grid Group -->
  <g transform="translate(40, 110)">
    <!-- Main outer grid container wireframe -->
    <rect x="0" y="0" width="720" height="230" rx="8" fill="#111827" stroke="#374151" stroke-width="2" />

    <!-- 12 Columns -->
    <!-- Col width = 44px, Gutter = 16px. Total = (44*12) + (16*11) = 528 + 176 = 704. Margin = 8px each side -->
    <!-- Draw columns with red fill and red border -->
    <rect x="8" y="0" width="44" height="230" fill="url(#colGrad)" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1" />
    <rect x="68" y="0" width="44" height="230" fill="url(#colGrad)" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1" />
    <rect x="128" y="0" width="44" height="230" fill="url(#colGrad)" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1" />
    <rect x="188" y="0" width="44" height="230" fill="url(#colGrad)" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1" />
    <rect x="248" y="0" width="44" height="230" fill="url(#colGrad)" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1" />
    <rect x="308" y="0" width="44" height="230" fill="url(#colGrad)" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1" />
    <rect x="368" y="0" width="44" height="230" fill="url(#colGrad)" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1" />
    <rect x="428" y="0" width="44" height="230" fill="url(#colGrad)" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1" />
    <rect x="488" y="0" width="44" height="230" fill="url(#colGrad)" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1" />
    <rect x="548" y="0" width="44" height="230" fill="url(#colGrad)" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1" />
    <rect x="608" y="0" width="44" height="230" fill="url(#colGrad)" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1" />
    <rect x="668" y="0" width="44" height="230" fill="url(#colGrad)" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1" />

    <!-- Aligning UI card elements on top of the grid -->
    <!-- Left Sidebar Card spanning 3 columns (Col 1, 2, 3) -->
    <!-- X = Margin 8 + 3 Cols (44*3) + 2 Gutters (16*2) = 8 + 132 + 32 = 172. Width = 164 -->
    <rect x="8" y="20" width="164" height="190" rx="10" fill="#1f2937" stroke="#4b5563" stroke-width="1.5" />
    <circle cx="90" cy="65" r="22" fill="#374151" />
    <rect x="40" y="105" width="100" height="12" rx="4" fill="#374151" />
    <rect x="60" y="125" width="60" height="8" rx="3" fill="#374151" />
    <rect x="28" y="155" width="124" height="22" rx="6" fill="#3b82f6" />

    <!-- Right Main Card spanning 9 columns (Col 4 to 12) -->
    <!-- X = 8 + 3 Cols (132) + 3 Gutters (48) + Spacer Margin = 188. Width = 524 -->
    <rect x="188" y="20" width="524" height="190" rx="10" fill="#1f2937" stroke="#4b5563" stroke-width="1.5" />
    <text x="215" y="55" font-family="'Segoe UI', sans-serif" font-weight="700" fill="#ffffff" font-size="16">Main Dashboard Section</text>
    <rect x="215" y="80" width="470" height="8" rx="4" fill="#374151" />
    <rect x="215" y="96" width="380" height="8" rx="4" fill="#374151" />
    <rect x="215" y="112" width="220" height="8" rx="4" fill="#374151" />

    <!-- Sub elements aligned perfectly with column start -->
    <rect x="215" y="140" width="144" height="46" rx="6" fill="#374151" />
    <!-- Spans Col 7 and 8 -->
    <rect x="375" y="140" width="144" height="46" rx="6" fill="#374151" />
    <!-- Spans Col 9 and 10 -->
    <rect x="535" y="140" width="150" height="46" rx="6" fill="#3b82f6" opacity="0.3" stroke="#3b82f6" stroke-width="1" />
  </g>

  <!-- Labels under grid -->
  <!-- Margin Label -->
  <text x="48" y="375" class="grid-num">margin: 8px</text>
  <!-- Column Label -->
  <text x="228" y="375" class="grid-num">column: 44px</text>
  <!-- Gutter Label -->
  <text x="448" y="375" class="grid-num">gutter: 16px</text>
  <!-- Columns Count Label -->
  <text x="648" y="375" class="grid-num">12 columns</text>

  <line x1="40" y1="360" x2="40" y2="385" stroke="#ef4444" stroke-width="1.5" />
  <line x1="210" y1="360" x2="210" y2="385" stroke="#ef4444" stroke-width="1.5" />
  <line x1="430" y1="360" x2="430" y2="385" stroke="#ef4444" stroke-width="1.5" />
  <line x1="680" y1="360" x2="680" y2="385" stroke="#ef4444" stroke-width="1.5" />
</svg>