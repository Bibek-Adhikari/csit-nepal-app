<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; fill: #f8fafc; font-size: 24px; }
    .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; font-size: 14px; }
    .item { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 16px; }
    .desc { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
  </style>

  <rect width="100%" height="100%" rx="16" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <text x="40" y="50" class="title">Visual Design Fundamentals</text>
  <text x="40" y="75" class="subtitle">The building blocks designers use to craft cohesive interfaces</text>

  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="225" height="90" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <rect x="15" y="18" width="24" height="24" rx="6" fill="none" stroke="#60a5fa" stroke-width="3" />
    <text x="55" y="36" class="item" fill="#60a5fa">Color</text>
    <text x="15" y="72" class="desc">Mood, meaning, attention &amp; cohesion</text>
  </g>

  <g transform="translate(288, 100)">
    <rect x="0" y="0" width="225" height="90" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="15" y="40" class="item" fill="#34d399">Typography</text>
    <text x="15" y="72" class="desc">Readability, personality &amp; brand voice</text>
  </g>

  <g transform="translate(536, 100)">
    <rect x="0" y="0" width="225" height="90" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <rect x="15" y="20" width="40" height="28" rx="3" fill="none" stroke="#fbbf24" stroke-width="3" />
    <text x="68" y="36" class="item" fill="#fbbf24">Grid &amp; space</text>
    <text x="15" y="72" class="desc">Arrangement, grids, whitespace</text>
  </g>

  <g transform="translate(40, 215)">
    <rect x="0" y="0" width="225" height="90" rx="12" fill="#1e293b" stroke="#ec4899" stroke-width="2" />
    <text x="15" y="40" class="item" fill="#f472b6">Hierarchy</text>
    <text x="15" y="72" class="desc">Visual weight sets reading order</text>
  </g>

  <g transform="translate(288, 215)">
    <rect x="0" y="0" width="225" height="90" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" />
    <rect x="15" y="24" width="30" height="30" rx="2" fill="none" stroke="#a78bfa" stroke-width="3" />
    <line x1="45" y1="24" x2="65" y2="24" stroke="#a78bfa" stroke-width="3" />
    <text x="78" y="40" class="item" fill="#a78bfa">Alignment</text>
    <text x="15" y="78" class="desc">Connected, deliberate lines</text>
  </g>

  <g transform="translate(536, 215)">
    <rect x="0" y="0" width="225" height="90" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="2" />
    <rect x="15" y="22" width="14" height="14" rx="3" fill="#22d3ee" />
    <rect x="35" y="22" width="14" height="14" rx="3" fill="#22d3ee" opacity="0.6" />
    <rect x="55" y="22" width="14" height="14" rx="3" fill="#22d3ee" opacity="0.35" />
    <text x="82" y="36" class="item" fill="#22d3ee">Repetition</text>
    <text x="15" y="72" class="desc">Unity &amp; reinforced identity</text>
  </g>

  <text x="400" y="400" text-anchor="middle" class="desc" font-weight="600" fill="#64748b">Color &middot; Typography &middot; Layout &middot; Hierarchy &middot; Alignment &middot; Repetition</text>
</svg>
