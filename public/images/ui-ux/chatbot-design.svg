<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; fill: #f8fafc; font-size: 24px; }
    .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; font-size: 14px; }
    .label { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 13px; }
    .desc { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; fill: #94a3b8; }
  </style>

  <rect width="100%" height="100%" rx="16" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <text x="40" y="50" class="title">Chatbot Design</text>
  <text x="40" y="75" class="subtitle">Designing conversational flows that feel helpful and human</text>

  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="720" height="270" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <text x="18" y="28" class="label" fill="#60a5fa">Sample conversation flow</text>

    <rect x="24" y="44" width="250" height="30" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="36" y="63" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">User: Book a flight to Pokhara</text>

    <rect x="300" y="44" width="250" height="30" rx="8" fill="#0f172a" stroke="#10b981" />
    <text x="312" y="63" font-family="'Segoe UI', sans-serif" font-size="11" fill="#34d399">Bot: When would you like to fly?</text>

    <rect x="24" y="92" width="250" height="30" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="36" y="111" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">User: Friday morning</text>

    <rect x="300" y="92" width="250" height="30" rx="8" fill="#0f172a" stroke="#10b981" />
    <text x="312" y="111" font-family="'Segoe UI', sans-serif" font-size="11" fill="#34d399">Bot: Found 3 options. Departing 7am?</text>

    <rect x="24" y="140" width="250" height="30" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="36" y="159" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">User: Yes, book it</text>

    <rect x="300" y="140" width="250" height="30" rx="8" fill="#0f172a" stroke="#10b981" />
    <text x="312" y="159" font-family="'Segoe UI', sans-serif" font-size="11" fill="#34d399">Bot: Confirmed! Enjoy your trip.</text>

    <text x="18" y="196" class="label" fill="#fbbf24">Design best practices</text>
    <text x="20" y="220" class="desc" fill="#94a3b8">&bull; Offer quick replies / buttons to guide users</text>
    <text x="20" y="238" class="desc" fill="#94a3b8">&bull; Handle "I don't know" with graceful fallbacks</text>
    <text x="20" y="256" class="desc" fill="#94a3b8">&bull; Add a "human agent" escape hatch</text>
  </g>
</svg>
