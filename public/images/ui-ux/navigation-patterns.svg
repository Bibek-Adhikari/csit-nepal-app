<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; fill: #f8fafc; font-size: 24px; }
    .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; font-size: 14px; }
    .pattern { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 14px; }
    .desc { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; fill: #94a3b8; }
  </style>

  <rect width="100%" height="100%" rx="16" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <text x="40" y="50" class="title">Navigation Patterns</text>
  <text x="40" y="75" class="subtitle">Choosing the right way to move users through your product</text>

  <!-- Top nav -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="225" height="140" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <text x="14" y="26" class="pattern" fill="#60a5fa">Top Navigation Bar</text>
    <rect x="14" y="38" width="196" height="18" rx="4" fill="#0f172a" stroke="#334155" />
    <rect x="20" y="43" width="50" height="8" rx="3" fill="#3b82f6" />
    <rect x="120" y="43" width="22" height="8" rx="3" fill="#475569" />
    <rect x="150" y="43" width="22" height="8" rx="3" fill="#475569" />
    <rect x="180" y="43" width="22" height="8" rx="3" fill="#475569" />
    <rect x="14" y="68" width="196" height="56" rx="5" fill="#0f172a" stroke="#1e293b" />
    <text x="14" y="128" class="desc">Logo left, links right. Best for 5-7 items.</text>
  </g>

  <!-- Sidebar -->
  <g transform="translate(288, 100)">
    <rect x="0" y="0" width="225" height="140" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="14" y="26" class="pattern" fill="#34d399">Sidebar</text>
    <rect x="14" y="38" width="52" height="88" rx="4" fill="#0f172a" stroke="#334155" />
    <rect x="20" y="44" width="40" height="7" rx="3" fill="#10b981" />
    <rect x="20" y="58" width="40" height="7" rx="3" fill="#475569" />
    <rect x="20" y="72" width="40" height="7" rx="3" fill="#475569" />
    <rect x="20" y="86" width="40" height="7" rx="3" fill="#475569" />
    <rect x="20" y="100" width="40" height="7" rx="3" fill="#475569" />
    <rect x="76" y="38" width="134" height="88" rx="4" fill="#0f172a" stroke="#1e293b" />
    <text x="14" y="128" class="desc">Vertical menu. Great for dashboards &amp; admin.</text>
  </g>

  <!-- Bottom nav -->
  <g transform="translate(536, 100)">
    <rect x="0" y="0" width="225" height="140" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <text x="14" y="26" class="pattern" fill="#fbbf24">Bottom Navigation</text>
    <rect x="14" y="38" width="196" height="80" rx="4" fill="#0f172a" stroke="#334155" />
    <circle cx="42" cy="66" r="9" fill="none" stroke="#fbbf24" stroke-width="2" />
    <circle cx="83" cy="66" r="9" fill="none" stroke="#475569" stroke-width="2" />
    <circle cx="124" cy="66" r="9" fill="none" stroke="#475569" stroke-width="2" />
    <circle cx="165" cy="66" r="9" fill="none" stroke="#475569" stroke-width="2" />
    <rect x="14" y="112" width="196" height="8" rx="3" fill="#f59e0b" />
    <text x="14" y="128" class="desc">3-5 items at thumb reach. Mobile standard.</text>
  </g>

  <!-- Tabs -->
  <g transform="translate(40, 270)">
    <rect x="0" y="0" width="225" height="110" rx="12" fill="#1e293b" stroke="#ec4899" stroke-width="2" />
    <text x="14" y="26" class="pattern" fill="#f472b6">Tabs</text>
    <rect x="14" y="40" width="58" height="20" rx="4" fill="#0f172a" stroke="#ec4899" />
    <rect x="78" y="40" width="58" height="20" rx="4" fill="#0f172a" stroke="#334155" />
    <rect x="142" y="40" width="58" height="20" rx="4" fill="#0f172a" stroke="#334155" />
    <rect x="14" y="72" width="196" height="26" rx="4" fill="#0f172a" stroke="#1e293b" />
    <text x="14" y="102" class="desc">Switch views in the same context.</text>
  </g>

  <!-- Hamburger -->
  <g transform="translate(288, 270)">
    <rect x="0" y="0" width="225" height="110" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" />
    <text x="14" y="26" class="pattern" fill="#a78bfa">Hamburger Menu</text>
    <rect x="14" y="40" width="196" height="30" rx="4" fill="#0f172a" stroke="#334155" />
    <line x1="24" y1="50" x2="48" y2="50" stroke="#a78bfa" stroke-width="3" />
    <line x1="24" y1="58" x2="40" y2="58" stroke="#a78bfa" stroke-width="3" />
    <line x1="24" y1="66" x2="44" y2="66" stroke="#a78bfa" stroke-width="3" />
    <text x="14" y="102" class="desc">Saves space, but hides discoverability.</text>
  </g>

  <!-- Breadcrumbs -->
  <g transform="translate(536, 270)">
    <rect x="0" y="0" width="225" height="110" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="2" />
    <text x="14" y="26" class="pattern" fill="#22d3ee">Breadcrumbs</text>
    <rect x="14" y="40" width="196" height="24" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="24" y="56" font-family="'Segoe UI', sans-serif" font-size="11" fill="#22d3ee">Home &gt; Courses &gt; BCA</text>
    <text x="14" y="96" class="desc">Show location in a deep hierarchy.</text>
  </g>
</svg>
